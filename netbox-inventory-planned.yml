---
plugin: netbox.netbox.nb_inventory
validate_certs: True
config_context: True
flatten_config_context: True
compose:
  ansible_network_os: platform.slug
group_by:
  - region
  - device_roles
  - device_types
  - platforms
  - sites
  - site_group
  - is_virtual
  - tenants
group_names_raw: True
interfaces: True
query_filters:
  - status: planned
  - manufacturers: cisco
