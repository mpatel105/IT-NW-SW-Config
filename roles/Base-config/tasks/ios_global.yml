- name: IOS - Enable LLDP
  cisco.ios.ios_lldp_global:
    config:
      enabled: true
    state: merged
  tags:
    - lldp
    - global

- name: IOS - configure dns
  ios_system:
    hostname: "{{ hostname | default(inventory_hostname) }}"
    domain_name: "{{ domain_name }}"
    lookup_source: vlan251
    lookup_enabled: yes
    name_servers: "{{ dns_servers }}"
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure NTP servers
  cisco.ios.ios_ntp_global:
    config:
      servers:
        - server: "{{ ntp_servers[0] }}"
          version: 2
          use_ipv4: True
        - server: "{{ ntp_servers[1] }}"
          version: 2
          use_ipv4: True
        - server: "{{ ntp_servers[2] }}"
          version: 2
          use_ipv4: True
        - server: "{{ ntp_servers[3] }}"
          version: 2
          use_ipv4: True
      source: vlan251
    state: replaced
  when: ansible_network_os == 'ios'
  tags:
    - global
    - ntp

- name: IOS - UTC Timezone
  ios_command:
    commands:
      - configure terminal
      - "clock timezone UTC 0 0"
      - "no clock summer-time"
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - STP Global configuration for Access switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 priority 32768
      - exit
  when: ansible_network_os == 'ios' and 'access' in group_names
  tags:
    - global

- name: IOS - STP Global configuration for Core or Distribution switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 root primary
      - exit
  when: ansible_network_os == 'ios' and ('core' in group_names or 'distribution' in group_names)
  tags:
    - global

- name: IOS - configure some service / disable unused service
  ios_config:
    lines:
      - no ip http server
      - no ip http secure-server
      - service timestamps log datetime msec show-timezone
      - service timestamps debug datetime msec show-timezone
      - service password-encryption
      - vtp mode off
      - errdisable recovery cause bpduguard
      - privilege exec level 3 authentication display config-mode
      - privilege exec level 3 authentication display
      - privilege exec level 3 authentication
      - privilege exec level 3 show startup-config
      - privilege exec level 3 show running-config view full
      - privilege exec level 3 show running-config view
      - privilege exec level 3 show running-config
      - privilege exec level 3 show
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure SNMP
  ios_command:
    commands:
      - configure terminal
      - access-list 98 permit any
      - snmp-server community {{ talend_snmp_community }} RO 98
      - snmp-server location {{ inventory_hostname[:7][:-5] | upper }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure logging
  cisco.ios.ios_logging_global:
    config:
      buffered:
        size: 16384
        xml: False
        severity: informational
      console:
        severity: critical
      hosts:
        - hostname: "{{ logs_servers[0] }}"
        - hostname: "{{ logs_servers[1] }}"
          transport:
            udp:
              port: 1515
      logging_on: enable
      source_interface:
        - interface: Vlan251
    state: overridden
  when: ansible_network_os == 'ios'
  tags:
    - global
    - syslog

- name: IOS - SSH configuration
  ios_command:
    commands:
      - configure terminal
      - crypto key generate rsa usage-keys label qlik modulus 2048
      - ip ssh rsa keypair-name qlik
      - ip ssh dh min size 2048
      - ip ssh version 2
      - exit
  vars:
    ansible_command_timeout: 120
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Login banner
  ios_banner:
    banner: login
    text: "{{ banner }}"
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Disable AUX login
  ios_command:
    commands:
      - configure terminal
      - line aux 0
      - transport input none
      - transport output none
      - no exec
      - exec-timeout 0 1
      - no password
      - exit
  ignore_errors: yes
  when: ansible_network_os == 'ios' and '9200' in ansible_net_model
  tags:
    - global

- name: IOS - remove all users except admin
  no_log: true
  ios_user:
    purge: yes
  when: ansible_network_os == 'ios'
  tags:
    - global

