---
- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - global
    - interfaces

- name: napalm get_facts
  napalm.napalm.get_facts:
    filter: facts,lldp_neighbors_detail
  register: napalmfacts
  when: ansible_network_os == 'ios'
  tags:
    - interfaces

- name: IOS - set fact for portfast
  set_fact:
    edge: "{% if item in ansible_net_model %}edge{% else %}{% endif %}"
  loop: "{{ model_stp_edge }}"
  when: ansible_network_os == 'ios'
  tags:
    - global
    - interfaces

