- name: IOS - enable secret scrypt
#  no_log: true
  ios_command:
    commands:
      - configure terminal
      - enable secret 9 {{ adminlocal_password }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global
    - localadmin
