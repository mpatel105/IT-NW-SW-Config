- name: IOS - configure dns
  ios_system:
    hostname: "{{ hostname }}"
    domain_name: "{{ talend_domain_name }}"
    lookup_source: vlan999
    lookup_enabled: yes
    name_servers: "{{ talend_dns }}"
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure NTP servers
  cisco.ios.ios_ntp_global:
    config:
      servers:
        - server: "{{ talend_ntp_server }}"
          use_ipv4: True
      source: vlan999
    state: overridden
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure NTP servers
  cisco.ios.ios_ntp_global:
    config:
      servers:
        - server: "{{ talend_ntp_server }}"
          use_ipv4: True
      source: vlan999
    state: overridden
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - UTC Timezone
  ios_command:
    commands:
      - configure terminal
      - "clock timezone UTC 0 0"
      - "no clock summer-time"
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - STP Global configuration for Access switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 priority 32768
      - exit
  when: ansible_network_os == 'ios' and 'ACCESS' in group_names
  tags:
    - global

- name: IOS - STP Global configuration for Core switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 root primary
      - exit
  when: ansible_network_os == 'ios' and 'CORE' in group_names
  tags:
    - global

- name: IOS - configure some service / disable unused service
  ios_config:
    lines:
      - no ip http server
      - no ip http secure-server
      - service timestamps log datetime msec show-timezone
      - service timestamps debug datetime msec show-timezone
      - service password-encryption
      - vtp mode off
      - errdisable recovery cause bpduguard
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure SNMP
  ios_command:
    commands:
      - configure terminal
      - access-list 98 permit any
      - snmp-server community {{ talend_snmp_community }} RO 98
      - snmp-server location {{ inventory_hostname[:3]|upper }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - configure logging
  cisco.ios.ios_logging_global:
    config:
      buffered:
        size: 16384
        xml: False
        severity: notifications
      console:
        severity: critical
      hosts:
        - hostname: "{{ talend_logs }}"
      logging_on: enable
      source_interface:
        - interface: Vlan999
    state: overridden
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - SSH configuration
  ios_command:
    commands:
      - configure terminal
      - crypto key generate rsa usage-keys label talend modulus 2048
      - ip ssh rsa keypair-name talend
      - ip ssh dh min size 2048
      - ip ssh version 2
      - exit
  vars:
    ansible_command_timeout: 120
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Login banner
  ios_banner:
    banner: login
    text: "{{ banner }}"
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Set IOS Interface Description from CDP
  ios_config:
    lines:
      - description Connected to {{ item.value[0].host }} int {{ item.value[0].port }}
    parents: interface {{ item.key }}
  loop: "{{ ansible_net_neighbors | default({}) | dict2items }}"
  when:
    - ansible_network_os == 'ios'
    - item.value[0].platform is defined
    - ("cisco" in item.value[0].platform)
  tags:
    - interfaces

- name: IOS - Configure interface in vlan 8 - End Users
  ios_config:
    lines:
      - description Wired Users VLAN
      - switchport mode access
      - spanning-tree portfast {{ edge }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and item.access.vlan is defined and item.access.vlan == 8) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 8)
  tags:
    - interfaces

- name: IOS - Configure interface in vlan 24/40/48 - Ops devices & A/V
  ios_config:
    lines:
      - switchport mode access
      - spanning-tree portfast {{ edge }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and item.access.vlan is defined and (item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48)) or
      (item.mode is not defined and item.access.vlan is defined and (item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48))
  tags:
    - interfaces

- name: IOS - Configure description tags in vlan 24 - Ops devices
  ios_config:
    lines:
      - description VLAN24 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan is defined and item.access.vlan == 24) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 24)) and
      ( ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      output.ansible_facts.ansible_net_interfaces[item.name].description == None) or
      (output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN24 -')) )
  tags:
    - interfaces

- name: IOS - Configure description tags in vlan 40 - Phones
  ios_config:
    lines:
      - description VLAN40 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan is defined and item.access.vlan == 40) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 40)) and
      ( ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      output.ansible_facts.ansible_net_interfaces[item.name].description == None) or
      (output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN40 -')) )
  tags:
    - interfaces

- name: IOS - Configure description tags in vlan 48 - Audio/Video
  ios_config:
    lines:
      - description VLAN48 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan is defined and item.access.vlan == 48) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 48)) and
      ( ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      output.ansible_facts.ansible_net_interfaces[item.name].description == None) or
      (output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN48 -')) )
  tags:
    - interfaces

- name: IOS - Configure interface for Cisco Meraki
  ios_config:
    lines:
      - description Wifi AP {{ napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key][0]['remote_system_name'] }}
      - switchport trunk native vlan 999
      - switchport trunk allowed vlan 16,24,240,999
      - switchport mode trunk
    parents: interface {{ item.key }}
  loop: "{{ ansible_net_neighbors | default({}) | dict2items }}"
  when:
    - ansible_network_os == "ios" and
      (item.value[0].platform is defined and "Meraki" in item.value[0].platform)
  tags:
    - interfaces

- name: IOS - Disable AUX login
  ios_command:
    commands:
      - configure terminal
      - line aux 0
      - transport input none
      - transport output none
      - no exec
      - exec-timeout 0 1
      - no password
      - exit
  ignore_errors: yes
  when: ansible_network_os == 'ios' and '9200' in ansible_net_model
  tags:
    - global

- name: IOS - remove all users except admin
  no_log: true
  ios_user:
    purge: yes
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - remove all credentials
  ios_command:
    commands:
      - configure terminal
      - no ip ssh pubkey-chain
      - no ip ftp username
      - no enable password
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Add admin user with  hashed password
  no_log: true
  ios_user:
    name: "{{ adminlocal_username }}"
    hashed_password:
      type: 9
      value: "{{ admin_hash_password }}"
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - set admin user to privilege level 15
  no_log: true
  ios_user:
    aggregate:
      - name: "{{ adminlocal_username }}"
    privilege: 15
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - enable secret scrypt
  no_log: true
  ios_command:
    commands:
      - configure terminal
      - enable secret 9 {{ admin_hash_password }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Configure SV2-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_SV2 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key {{ talend_radius_key }}
    parents: radius server {{ talend_radius_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Configure PA7-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_PA7 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key {{ talend_radius_key }}
    parents: radius server {{ talend_radius_PA7_name }}
    before: no radius server SUR-Radius
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Configure group Global-Radius-Servers
  ios_config:
    lines:
      - server name {{ talend_radius_1_name }}
      - server name {{ talend_radius_2_name }}
      - deadtime 5
    parents: aaa group server radius Global-Radius-Servers
    before: no aaa group server radius Global-Radius-Servers
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Configure Radius Global Config
  ios_config:
    lines:
      - aaa authentication login default group Global-Radius-Servers local
      - aaa authorization console
      - aaa authorization exec default group Global-Radius-Servers local
      - aaa accounting exec default start-stop group Global-Radius-Servers
      - aaa accounting system default start-stop group Global-Radius-Servers
      - ip radius source-interface Vlan999
  when: ansible_network_os == 'ios'
  tags:
    - global

- name: IOS - Save config
  ios_config:
    save_when: always
  when: ansible_network_os == 'ios'
  tags:
    - global
    - interfaces
