- name: IOS - remove legacy admin
  cisco.ios.ios_config:
    lines:
      - no username admin
  when: ansible_network_os == 'ios'
  tags:
    - global
    - localadmin

- name: IOS - Add admin user with  hashed password
#  no_log: true
  cisco.ios.ios_user:
    name: "{{ adminlocal_username }}"
    password_type: secret
    privilege: 15
    hashed_password:
      type: 9
      value: "{{ adminlocal_password }}"
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - global
    - localadmin

# - name: IOS - set admin user to privilege level 15
# #  no_log: true
#   ios_user:
