---
- name: NXOS - get facts
  nxos_facts:
    gather_subset: hardware
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS
    - updateTACACS
    - newTACACS
    - interfaces
    - syslog
    - radius
    - dc4
    - configdns
    - configntp

- name: NXOS - configure dns
  nxos_system:
    hostname: "{{ hostname }}"
    domain_name: "{{ domain_name }}"
    domain_lookup: yes
    name_servers: "{{ dns_servers }}"
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - configdns
    - dc4

- name: NXOS - configure NTP servers
  cisco.nxos.nxos_ntp_global:
    config:
      logging: True
      servers:
        - server: "{{ ntp_servers[0] }}"
          use_vrf: "{{ custom_fields.Nexus_VRF_mgmt }}"
          prefer: true
        - server: "{{ ntp_servers[1] }}"
          use_vrf: "{{ custom_fields.Nexus_VRF_mgmt }}"
          prefer: true
        - server: "{{ ntp_servers[2] }}"
          use_vrf: "{{ custom_fields.Nexus_VRF_mgmt }}"
        - server: "{{ ntp_servers[3] }}"
          use_vrf: "{{ custom_fields.Nexus_VRF_mgmt }}"
#      source_interface: "{% if hostname in mgmt0 %}mgmt0{% else %}Vlan999{% endif %}"
    state: replaced
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - configntp
    - dc4

- name: NXOS - UTC Timezone
  nxos_command:
    commands:
      - configure terminal
      - "clock timezone UTC 0 0"
      - "no clock summer-time"
      - exit
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - dc4

- name: NXOS - STP Global configuration for Core switches
  nxos_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree pathcost method long
      - spanning-tree port type edge bpduguard default
      - "{% if '001' in inventory_hostname %}spanning-tree vlan 1-3967 root primary{% else %}spanning-tree vlan 1-3967 root secondary{% endif %}"
      - exit
  when: ansible_network_os == 'nxos' and ('core' in group_names or 'distribution' in group_names)
  tags:
    - global

- name: NXOS - STP Global configuration for Access switches
  nxos_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree pathcost method long
      - spanning-tree port type edge bpduguard default
      - spanning-tree vlan 1-3967 priority 32768
      - exit
  when: ansible_network_os == 'nxos' and 'access' in group_names
  tags:
    - global

- name: NXOS - configure some service / disable unused service
  nxos_config:
    lines:
      - errdisable recovery cause bpduguard
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - disable unused feature
  nxos_feature:
    feature: vtp
    state: disabled
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - new ACLs configuration for SNMP
  cisco.nxos.nxos_acls:
    config:
    - afi: ipv4
      acls:
      - name: ACLsnmp
        aces:
        - grant: permit
          source:
            any: true
          destination:
            any: true
          protocol: ip
        - remark: For logging
    state: replaced
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - dc4

- name: NXOS - delete existing snmp configuration
  cisco.nxos.nxos_snmp_server:
    state: deleted
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - configure SNMP
  cisco.nxos.nxos_snmp_server:
    config:
      communities:
        - community: "{{ talend_snmp_community }}"
          group: network-operator
          use_ipv4acl: ACLsnmp
      location: "{{ inventory_hostname[:7][:-5] | upper }}"
    state: merged
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - configure logging
  cisco.nxos.nxos_logging_global:
    config:
      monitor:
        severity: alert
      hosts:
        - host: "{{ logs_servers[0] }}"
          severity: warning
          port: 1515
          vrf: "{{ 'management' if custom_fields.Nexus_VRF_mgmt == 'management' else omit }}"
      logfile:
        name: logs
        severity: informational
      source_interface: "{% if custom_fields.Nexus_VRF_mgmt == 'management' %}mgmt0{% else %}{{ logging_source_interface }}{% endif %}"
    state: replaced
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - syslog
    - dc4

- name: NXOS - SSH configuration
  nxos_command:
    commands:
      - configure terminal
      - ssh key rsa 2048 force
      - exit
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - Login banner
  nxos_banner:
    banner: motd
    text: "{{ banner }}"
    state: present
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - dc4

- name: NXOS - remove all users except admin
  no_log: true
  nxos_user:
    purge: yes
    name: "{{ adminlocal_username }}"
    configured_password: "{{ adminlocal_password }}"
    role: network-admin
    update_password: always
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - Configure Radius servers
  nxos_config:
    lines:
      - radius-server host {{ talend_radius_1 }} key {{ talend_radius_key }} authentication accounting timeout 3
      - radius-server host {{ talend_radius_2 }} key {{ talend_radius_key }} authentication accounting timeout 3
      - radius-server deadtime 5
      - radius-server directed-request
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - Configure group Global-Radius-Servers
  nxos_config:
    lines:
      - server {{ talend_radius_1 }}
      - server {{ talend_radius_2 }}
      - deadtime 5
    parents: aaa group server radius Global-Radius-Servers
    before: no aaa group server radius Global-Radius-Servers
    match: exact
  when: ansible_network_os == 'nxos'
  tags:
    - global

- name: NXOS - Configure Radius Global Config
  nxos_config:
    lines:
      - aaa authentication login default group Global-Radius-Servers local
      - aaa authentication login console local
      - aaa accounting default group Global-Radius-Servers
      - "ip radius source-interface {% if hostname in mgmt0 %}mgmt0{% else %}Vlan999{% endif %}"
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - radius

- name: NXOS - Save config
  nxos_config:
    save_when: always
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - interfaces
