- name: IOS - Configure Tacacs_1
  ios_config:
    lines:
      - address ipv4 {{ tacacs_1_new_ip }}
      - key 0 {{ tacacs_1_new_key }}
    parents: tacacs server {{ tacacs_1_new_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - newTACACS

- name: IOS - Configure Tacacs_2
  ios_config:
    lines:
      - address ipv4 {{ tacacs_2_new_ip }}
      - key 0 {{ tacacs_2_new_key }}
    parents: tacacs server {{ tacacs_2_new_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - newTACACS

- name: IOS - Configure group Portnox-newTACACS-Group
  ios_config:
    lines:
      - server name {{ tacacs_1_new_name }}
      - server name {{ tacacs_2_new_name }}
    parents: aaa group server tacacs+ Portnox-newTACACS-Group
  when: ansible_network_os == 'ios'
  tags:
    - global
    - newTACACS

- name: IOS - Remove SV2 from group Portnox-newTACACS-Group
  ios_config:
    lines:
      - no server name sv2-tacacs-001
    parents: aaa group server tacacs+ Portnox-newTACACS-Group
  when: ansible_network_os == 'ios'
  tags:
    - newTACACS

