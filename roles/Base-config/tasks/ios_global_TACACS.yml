- name: IOS - Configure TACACS Global Config
  ios_config:
    lines:
      - ip tacacs source-interface {{ vlan_nw_mgmt }}
      - tacacs-server timeout 10
      - aaa authentication login default group Portnox-newTACACS-Group local
      - aaa authorization console
      - aaa authorization exec default group Portnox-newTACACS-Group if-authenticated
      - aaa authorization commands 15 default group Portnox-newTACACS-Group if-authenticated
      - aaa accounting exec default start-stop group Portnox-newTACACS-Group
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Save running to startup
  ios_config:
    save_when: always
  when: ansible_network_os == 'ios'
  tags:
    - updateTACACS
#    - newTACACS

- name: IOS - Cleanup old config
  ios_config:
    lines:
      - no aaa group server radius Global-Radius-Servers
      - no radius server PA7-Radius
      - no radius server SV2-Radius
      - no aaa accounting system default
  when: ansible_network_os == 'ios'
  tags:
    - globalTACACS_Cleanup
