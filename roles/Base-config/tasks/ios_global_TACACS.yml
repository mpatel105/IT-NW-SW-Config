---

- name: IOS - Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure SV2_Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_SV2 }}
      - key 0 {{ tacacs_SV2_key }}
    parents: tacacs server {{ tacacs_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure PA7_Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_PA7 }}
      - key 0 {{ tacacs_PA7_key }}
    parents: tacacs server {{ tacacs_PA7_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure group Portnox-TACACS-Group
  ios_config:
    lines:
      - server name {{ tacacs_1_name }}
      - server name {{ tacacs_2_name }}
    parents: aaa group server tacacs+ Portnox-TACACS-Group
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure TACACS Global Config
  ios_config:
    lines:
      - ip tacacs source-interface {{ vlan_nw_mgmt }}
      - tacacs-server timeout 10
      - aaa authentication login default group Portnox-TACACS-Group local
      - aaa authorization console
      - aaa authorization exec default group Portnox-TACACS-Group if-authenticated
      - aaa authorization commands 15 default group Portnox-TACACS-Group if-authenticated
      - aaa accounting exec default start-stop group Portnox-TACACS-Group
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS


- name: IOS - Cleanup old config
  ios_config:
    lines:
      - no aaa group server radius Global-Radius-Servers
      - no radius server PA7-Radius
      - no radius server SV2-Radius
      - no aaa accounting system default
  when: ansible_network_os == 'ios'
  tags:
    - globalTACACS_Cleanup
