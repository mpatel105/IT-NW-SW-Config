---

- name: IOS - Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure SV2-Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_SV2 }}
      - key {{ tacacs_SV2_key }}
    parents: tacacs server {{ tacacs_SV2_name }}
    before: no tacacs server {{ tacacs_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure PA7-Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_PA7 }}
      - key {{ tacacs_PA7_key }}
    parents: tacacs server {{ tacacs_PA7_name }}
    before: no tacacs server {{ tacacs_PA7_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

