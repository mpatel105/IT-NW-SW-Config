---

- name: IOS - Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure SV2_Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_SV2 }}
      - key {{ tacacs_SV2_key }}
    parents: tacacs server {{ tacacs_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure PA7_Tacacs
  ios_config:
    lines:
      - address ipv4 {{ tacacs_PA7 }}
      - key {{ tacacs_PA7_key }}
    parents: tacacs server {{ tacacs_PA7_name }}
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure group PORTNOX_TACACS_Servers
  ios_config:
    lines:
      - server name {{ tacacs_1_name }}
      - server name {{ tacacs_2_name }}
      - timeout 2
    parents: aaa group server tacacs+ PORTNOX_TACACS_Servers
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Configure TACACS Global Config
  ios_config:
    lines:
      - aaa authentication login default group PORTNOX_TACACS_Servers local
      - aaa authorization console
      - aaa authorization exec default group PORTNOX_TACACS_Servers if-authenticated
      - aaa authorization commands 15 default group PORTNOX_TACACS_Servers if-authenticated
      - aaa accounting exec default start-stop group PORTNOX_TACACS_Servers
      - ip tacacs source-interface Vlan999
  when: ansible_network_os == 'ios'
  tags:
    - global
    - globalTACACS

- name: IOS - Save config
  ios_config:
    save_when: always
  when: ansible_network_os == 'ios'
  tags:
    - global
