- name: NXOS - Configure group Portnox-newTACACS-Group
  nxos_config:
    lines:
      - server {{ tacacs_1_new_ip }}
      - server {{ tacacs_2_new_ip }}
    parents: aaa group server tacacs+ Portnox-newTACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - newTACACS

- name: IOS - Remove SV2 from group Portnox-newTACACS-Group
  nxos_config:
    lines:
      - no server 10.9.32.18
    parents: aaa group server tacacs+ Portnox-newTACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - newTACACS

