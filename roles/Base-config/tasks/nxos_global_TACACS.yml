---


- name: Ensure tacacs is enabled
  cisco.nxos.nxos_feature:
    feature: tacacs+
    state: enabled
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS


- name: NXOS - Configure SV2_Tacacs
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 3
    address: "{{ tacacs_SV2 }}"
    key: "{{ tacacs_SV2_key }}"
    encrypt_type: 7
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS

- name: NXOS - Configure PA7_Tacacs
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 3
    address: "{{ tacacs_PA7 }}"
    key: "{{ tacacs_PA7_key }}"
    encrypt_type: 7
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS



- name: NXOS - Configure group Portnox-TACACS-Group
  nxos_config:
    lines:
      - server name {{ tacacs_PA7 }}
      - server name {{ tacacs_SV2 }}
    parents: aaa group server tacacs+ Portnox-TACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS
