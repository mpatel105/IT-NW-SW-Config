---


- name: Ensure tacacs is enabled
  cisco.nxos.nxos_feature:
    feature: tacacs+
    state: enabled
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS


- name: NXOS - Configure SV2_Tacacs
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 10
    address: "{{ tacacs_SV2 }}"
    key: "{{ tacacs_SV2_key }}"
    encrypt_type: 0
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS

- name: NXOS - Configure PA7_Tacacs
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 10
    address: "{{ tacacs_PA7 }}"
    key: "{{ tacacs_PA7_key }}"
    encrypt_type: 0
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS



- name: NXOS - Configure group Portnox-TACACS-Group
  nxos_config:
    lines:
      - server {{ tacacs_PA7 }}
      - server {{ tacacs_SV2 }}
    parents: aaa group server tacacs+ Portnox-TACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS

- name: NXOS - Configure group Portnox-TACACS-Gr1
  ios_config:
    lines:
      - server {{ tacacs_1_ip }}
    parents: aaa group server tacacs+ Portnox-TACACS-Gr1
  when: ansible_network_os == 'ios'
  tags:
    - updateTACACS

- name: NXOS - Configure group Portnox-TACACS-Gr2
  ios_config:
    lines:
      - server {{ tacacs_2_ip }}
    parents: aaa group server tacacs+ Portnox-TACACS-Gr2
  when: ansible_network_os == 'ios'
  tags:
    - updateTACACS


- name: NXOS - Tacacs Server Basic settings
  cisco.nxos.nxos_aaa_server:
    server_type: tacacs
    server_timeout: 10
    deadtime: 19
    directed_request: disabled
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS


- name: NXOS - Configure TACACS Global Config
  nxos_config:
    lines:
      - ip tacacs source-interface {% if custom_fields.Nexus_VRF_mgmt == 'default' %}{{ vlan_nw_mgmt }}{% else %}mgmt0{% endif %}
      - tacacs-server timeout 10
      - aaa authentication login default group Portnox-TACACS-Group local
      - aaa authorization commands default group Portnox-TACACS-Group local
      - aaa accounting default group Portnox-TACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS

