- name: NXOS - Tacacs Server Basic settings
  cisco.nxos.nxos_aaa_server:
    server_type: tacacs
    server_timeout: 10
    deadtime: 19
    directed_request: disabled
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS


- name: NXOS - Configure TACACS Global Config
  nxos_config:
    lines:
      - ip tacacs source-interface {% if custom_fields.Nexus_VRF_mgmt == 'default' %}{{ vlan_nw_mgmt }}{% else %}mgmt0{% endif %}
      - tacacs-server timeout 10
      - aaa authentication login default group Portnox-newTACACS-Group local
      - aaa authorization commands default group Portnox-newTACACS-Group local
      - aaa accounting default group Portnox-newTACACS-Group
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - globalTACACS
    - newTACACS

