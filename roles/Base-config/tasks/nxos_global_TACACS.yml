- name: NXOS - Configure Tacacs_1
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 10
    address: "{{ tacacs_1_new_ip }}"
    key: "{{ tacacs_1_new_key }}"
    encrypt_type: 0
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - newTACACS

- name: NXOS - Configure Tacacs_2
  cisco.nxos.nxos_aaa_server_host:
    state: present
    server_type: tacacs
    host_timeout: 10
    address: "{{ tacacs_2_new_ip }}"
    key: "{{ tacacs_2_new_key }}"
    encrypt_type: 0
  when: ansible_network_os == 'nxos'
  tags:
    - global
    - newTACACS

