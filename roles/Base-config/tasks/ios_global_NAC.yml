- name: IOS-XE - Configure Interfaces for NAC
  ios_config:
    lines:
      - device-tracking attach-policy ip_device_tracking_policy
      - source template TEMPLATE_NAC_ENDPOINTS
    parents: interface {{ item.name }}
    before: default interface {{ item.name }}
    replace: block
    match: exact
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == 'ios' and ansible_net_iostype == 'IOS-XE' and (item.access.vlan is defined and item.access.vlan == 163 )
  tags:
    - NAC_NAN

- name: IOS - Configure Interfaces for NAC
  ios_config:
    lines:
      - source template TEMPLATE_NAC_ENDPOINTS
    parents: interface {{ item.name }}
    before: default interface {{ item.name }}
    match: exact
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == 'ios' and ansible_net_iostype == 'IOS' and (item.access.vlan is defined and item.access.vlan == 163 )
  tags:
    - NAC_NAN


- name: IOS-XE - Configure Interfaces for NAC
  ios_config:
    lines:
      - device-tracking attach-policy ip_device_tracking_policy
      - source template TEMPLATE_NAC_ENDPOINTS
    parents: interface {{ item.name }}
    before: default interface {{ item.name }}
    replace: block
    match: exact
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == 'ios' and ansible_net_iostype == 'IOS-XE' and ((item.access.vlan is defined and
      (item.access.vlan == 99 or item.access.vlan == 169 or item.access.vlan == 8 or item.access.vlan == 16 or item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48)) or
      napalm_interfaces[item.name]['description'] == 'NAC Endpoints')
  tags:
    - NACinterfaces
    - convertNAC

- name: IOS - Configure Interfaces for NAC
  ios_config:
    lines:
      - source template TEMPLATE_NAC_ENDPOINTS
    parents: interface {{ item.name }}
    before: default interface {{ item.name }}
    match: exact
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == 'ios' and ansible_net_iostype == 'IOS' and ((item.access.vlan is defined and
      (item.access.vlan == 99 or item.access.vlan == 169 or item.access.vlan == 8 or item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48)) or
      napalm_interfaces[item.name]['description'] == 'NAC Endpoints')
  tags:
    - NACinterfaces
    - convertNAC

- name: IOS - Configure interface for Cisco Meraki
  ios_config:
    lines:
      - source template TEMPLATE_TRUNK_WIFI_AP
    parents: interface {{ item.key }}
    before: default interface {{ item.key }}
    match: exact
  loop: "{{ ansible_net_neighbors | default({}) | dict2items }}"
  when:
    - ansible_network_os == "ios" and (item.value[0].platform is defined and "Meraki" in item.value[0].platform)
  tags:
    - NACinterfaces
    - convertNAC
    - meraki

