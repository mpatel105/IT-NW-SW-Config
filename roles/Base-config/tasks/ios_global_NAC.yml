---
# tasks file for test
#
# TAG list :
# - For already dot1x switch with IBNS1.0 run following tags:
#      - ConvertNAC1 (prepare global parameters and convert interfaces to template without NAC)
#      - reload the switch to reset old dot1x parameter
#      - ConvertNAC2 (apply IBNS2.0 & all global config)
#      - ConverNAC3: only if the phones or ops devices don't take NAc config, shut / no shut these interfaces
#
# - For new NAC configuration, run following tag:
#      - NACglobal
#
#

- name: IOS - get facts
  ios_facts:
    gather_subset:
      - '!config'
    gather_network_resources:
      - 'l2_interfaces'
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal
    - NACinterfaces
    - convertNAC
    - NACradius
    - facts
    - meraki
    - NAC_NAN


- name: napalm get_facts
  napalm.napalm.get_facts:
    filter: facts,interfaces,lldp_neighbors_detail,vlans
  register: napalmfacts
  when: ansible_network_os == 'ios'
  tags:
    - NACinterfaces
    - convertNAC
    - napalm

- name: Read in parse_genie role
  include_role:
    name: clay584.parse_genie
  when: ansible_network_os == 'ios'
  tags:
    - NACinterfaces
    - convertNAC

- name: IOS show interfaces status
  ios_command:
    commands: show interfaces status
  register: intstatusresult
  vars:
    ansible_command_timeout: 300
  when: ansible_network_os == 'ios'
  tags:
    - NACinterfaces
    - convertNAC

- name: Debug Genie Filter
  set_fact:
    int: "{{ intstatusresult['stdout'][0] | parse_genie(command='show interfaces status', os='ios') }}"
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - NACinterfaces
    - convertNAC

- name: IOS - Configure standard Vlan for Access Switches
  ios_vlans:
    config:
    - name: "{{ item.key }}"
      vlan_id: "{{ item.value }}"
      state: active
      shutdown: disabled
    state: merged
  loop: "{{ vlan_list_access | dict2items }}"
  when: ansible_network_os == 'ios' and inventory_hostname in access-switch
  tags:
    - NACglobal

- name: IOS - Configure standard Vlan for Distribution Switches
  ios_vlans:
    config:
    - name: "{{ item.key }}"
      vlan_id: "{{ item.value }}"
      state: active
      shutdown: disabled
    state: merged
  loop: "{{ vlan_list_dist | dict2items }}"
  when: ansible_network_os == 'ios' and inventory_hostname in distribution-switch
  tags:
    - NACglobal

