    # msg: "{{ output.ansible_facts.ansible_net_interfaces }}"
  #loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
    msg: "{{ edge }}"
  when:
    - ansible_network_os == "ios"
    #- item.value[0].platform is defined
    #- ("Cisco" in item.value[0].platform)
  tags:
    - config
    - get_fact_debug


