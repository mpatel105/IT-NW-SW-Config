- name: IOS - configure logging
#  cisco.ios.ios_logging_global:
#    config:
#      buffered:
#      size: 16384
#    severity: notifications
#  console:
#        severity: critical
#  ios_command:
#    commands:
#      - configure terminal
#      - no logging monitor
#      - no logging console
#      - no logging host 192.168.30.145
#      - no logging host 192.168.15.55
#      - no logging host 192.168.100.211
#      - no logging host 10.42.150.250
#      - logging buffered 16384
#      - logging host {{ talend_logs }}
#      - logging source-interface Vlan999
#      - exit
  ios_config:
    lines:
      - no logging monitor
      - no logging console
      - logging buffered 16384
      - logging host {{ talend_logs }}
      - logging source-interface Vlan999
  when: ansible_network_os == 'ios'
  tags:
    - config
    - logs

- name: NXOS - configure logging
  nxos_logging:
    aggregate:
    - { dest: console, state: absent }
    - { dest: monitor, state: absent }
    - {dest: logfile, dest_level: 5, name: message, state: present }
    - { dest: server, remote_server: "{{ talend_logs }}", state: present}
    - { interface: "Vlan 999", state: present }
    purge: true
  when: ansible_network_os == 'nxos'

- name: IOS - SSH configuration
  ios_command:
    commands:
      - configure terminal
      - crypto key generate rsa usage-keys label talend modulus 2048
      - ip ssh rsa keypair-name talend
      - ip ssh dh min size 2048
      - ip ssh version 2
      - exit
  vars:
    ansible_command_timeout: 120
  when: ansible_network_os == 'ios'
  tags:
    - config
    - ssh

- name: NXOS - SSH configuration
  nxos_command:
    commands:
      - configure terminal
      - ssh key rsa 2048 force
      - exit
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - ssh

- name: IOS - Login banner
  ios_banner:
    banner: login
    text: "{{ banner }}"
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - config
    - banner

- name: NXOS - Login banner
  nxos_banner:
    banner: motd
    text: "{{ banner }}"
    state: present
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - banner



- name: IOS - Set IOS Interface Description from CDP
  ios_config:
    lines:
      - description Connected to {{ item.value[0].host }} int {{ item.value[0].port }}
    parents: interface {{ item.key }}
  when:
    - ansible_network_os == 'ios'
    - ansible_net_neighbors is defined
    - item.value[0].platform is defined
    - ("cisco" in item.value[0].platform)
  loop: "{{ ansible_net_neighbors | dict2items }}"
  tags:
    - config
    - intdescr

- name: IOS - Configure interface in vlan 8 - End Users
  ios_config:
    lines:
      - description Wired Users VLAN
      - switchport mode access
      - spanning-tree portfast {{ edge }}
      - no spanning-tree guard loop
      - no spanning-tree bpduguard enable
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and item.access.vlan == 8) or
      (item.mode is not defined and item.access is defined and item.access.vlan == 8)
  tags:
    - config
    - configswitchports8

- name: IOS - Configure interface in vlan 24/48 - Ops devices & A/V
  ios_config:
    lines:
      - switchport mode access
      - spanning-tree portfast {{ edge }}
      - no spanning-tree guard loop
      - no spanning-tree bpduguard enable
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and (item.access.vlan == 24 or item.access.vlan == 48)) or
      (item.mode is not defined and item.access.vlan is defined and (item.access.vlan == 24 or item.access.vlan == 48))
  tags:
    - config
    - configswitchports2448

- name: IOS - Configure description tags in vlan 24 - Ops devices
  ios_config:
    lines:
      - description VLAN24 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan == 24) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 24)) and
      ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN24 - ') )
  tags:
#    - config
    - configswitchports24

- name: IOS - Configure description tags in vlan 48 - Audio/Video
  ios_config:
    lines:
      - description VLAN48 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan == 48) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 48)) and
      ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN48 - ') )
  tags:
#    - config
    - configswitchports48


- name: IOS - Configure interface for Cisco Meraki
  ios_config:
    lines:
      - description Wifi AP {{ item.value[0].host }}
    #  - switchport trunk native vlan 999
    #  - switchport trunk allowed vlan 16,24,240,999
    #  - switchport mode trunk
    parents: interface {{ item.key }}
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    - item.value[0].platform is defined
    - ("Cisco" in item.value[0].platform)
  tags:
    - config
    - configswitchportswifi


- name: IOS - Disable AUX login
  ios_command:
    commands:
      - configure terminal
      - line aux 0
      - transport input none
      - transport output none
      - no exec
      - exec-timeout 0 1
      - no password
      - exit
  ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - disableaux

- name: IOS - remove all users except admin
  no_log: true
  ios_user:
    purge: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - configusers

- name: NXOS - remove all users except admin
  no_log: true
  nxos_user:
    purge: yes
    name: admin
    configured_password: "{{ adminlocal_password }}"
    role: network-admin
    update_password: always
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - configusers

- name: IOS - remove all credentials
  ios_command:
    commands:
      - configure terminal
      - no ip ssh pubkey-chain
      - no ip ftp username
      - no enable password
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - configusers

- name: IOS - Add a user with  hashed password
  no_log: true
  ios_user:
    name: "{{ admin_user }}"
    hashed_password:
      type: 9
      value: "{{ admin_hash_password }}"
      #have to add this value in the vault and remove admin1 its just for testing
  tags:
    - config
    - configusers

- name: IOS - set multiple users to privilege level 15
  no_log: true
  ios_user:
    aggregate:
      - name: "{{ admin_user }}"
    privilege: 15
    state: present
  tags:
    - config
    - configusers

- name: IOS - enable secret scrypt
  no_log: true
  ios_command:
    commands:
      - configure terminal
      - enable secret 9 {{ admin_hash_password }}
      #need to create seperate secret jkey and update that in the vault
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - configenable

- name: IOS - Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: IOS - Configure SV2-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_SV2 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key 7 {{ talend_radius_server_key }}
    parents: radius server {{ talend_radius_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: IOS - Configure PA7-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_PA7 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key 7 {{ talend_radius_server_key }}
    parents: radius server {{ talend_radius_PA7_name }}
    before: no radius server SUR-Radius
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: NXOS - Configure Radius servers
  nxos_config:
    lines:
      - radius-server host {{ talend_radius_1 }} key 7 {{ talend_radius_server_key }} authentication accounting timeout 3
      - radius-server host {{ talend_radius_2 }} key 7 {{ talend_radius_server_key }} authentication accounting timeout 3
      - radius-server deadtime 5
      - radius-server directed-request
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - radius

- name: IOS - Configure group Global-Radius-Servers
  ios_config:
    lines:
      - server name {{ talend_radius_1_name }}
      - server name {{ talend_radius_2_name }}
      - deadtime 5
    parents: aaa group server radius Global-Radius-Servers
    before: no aaa group server radius Global-Radius-Servers
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: NXOS - Configure group Global-Radius-Servers
  ios_config:
    lines:
      - server {{ talend_radius_1 }}
      - server {{ talend_radius_2 }}
      - deadtime 5
    parents: aaa group server radius Global-Radius-Servers
    before: no aaa group server radius Global-Radius-Servers
    match: exact
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - radius

- name: IOS - Configure Radius Global Config
  ios_config:
    lines:
      - aaa authentication login default group Global-Radius-Servers local
      - aaa authorization console
      - aaa authorization exec default group Global-Radius-Servers local
      - aaa accounting exec default start-stop group Global-Radius-Servers
      - aaa accounting system default start-stop group Global-Radius-Servers
      - ip radius source-interface Vlan999
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: NXOS - Configure Radius Global Config
  ios_config:
    lines:
      - aaa authentication login default group Global-Radius-Servers local
      - aaa authentication login console local
      - aaa accounting default group Global-Radius-Servers
      - ip radius source-interface vlan 999
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - radius

- name: IOS - Save config
  ios_config:
    save_when: always
  when: ansible_network_os == 'ios'
  tags:
    - config
    - saveconfig

- name: NXOS - Save config
  nxos_config:
    save_when: always
  when: ansible_network_os == 'nxos'
  tags:
    - config
    - saveconfig
