# tasks file for switch-config
#

- name: IOS get fact
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  tags:
    - config
    - configswitchports
    - configswitchports8
    - configswitchports2448
    - configswitchports24
    - configswitchports48
    - configswitchportswifi
    - get_fact_debug
    - intdescr
    - endusers

- name: set fact for portfast
  set_fact:
    edge: "{% if item in ansible_net_model %}edge{% else %}{% endif %}"
  loop: "{{ model_stp_edge }}"
  tags:
    - get_fact_debug
    - config

