---
# tasks file for switch-config
#

- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - config
    - configswitchports
    - configswitchports8
    - configswitchports2448
    - configswitchports24
    - configswitchports48
    - configswitchportswifi
    - get_fact_debug
    - intdescr
    - endusers

- name: NXOS - get facts
  nxos_facts:
    gather_subset: hardware
  when: ansible_network_os == 'nxos'
  tags:
    - config

- name: IOS - set fact for portfast
  set_fact:
    edge: "{% if item in ansible_net_model %}edge{% else %}{% endif %}"
  loop: "{{ model_stp_edge }}"
  when: ansible_network_os == 'ios'
  tags:
    - get_fact_debug
    - config

- debug:
    #msg: "host is {{ item.value[0].host }} and platform is {{ item.value[0].platform }}"
    # msg: "host is {{ item.value[0] }} "
    # msg: "{{ output.ansible_facts.ansible_net_neighbors | type_debug }}"
    # msg: "{{ group_names }}"
    # msg: "{{ output.ansible_facts.ansible_net_interfaces }}"
  #loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
    msg: "{{ edge }}"
  when:
    - ansible_network_os == "ios"
    #- item.value[0].platform is defined
    #- ("Cisco" in item.value[0].platform)
  tags:
    - config
    - get_fact_debug


