- name: IOS configure dns
  ios_system:
  #  hostname: "{{ inventory_hostname }}"
    domain_name: "{{ talend_domain_name }}"
    lookup_source: vlan999
    lookup_enabled: yes
    name_servers: "{{ talend_dns }}"
  when: ansible_network_os == 'ios'
  tags:
    - config
    - dns

- name: IOS configure NTP servers
# cisco.ios.ios_ntp_global:
#   config:
#     servers:
#       - server: ntp.talend.com
#     source: vlan100
#     state: replaced
  ios_ntp:
    server: "{{ talend_ntp }}"
    source_int: vlan999
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - config
    - ntp

- name: IOS UTC Timezone
  ios_command:
    commands:
      - configure terminal
      - "clock timezone UTC 0 0"
      - "no clock summer-time"
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - clock

- name: STP Global configuration for IOS Access switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 priority 32768
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios' and 'ACCESS' in group_names
  tags:
    - config
    - STPaccess

- name: STP Global configuration for IOS Core switches
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast {{ edge }} bpduguard default
      - spanning-tree vlan 1-4094 root primary
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios' and 'CORE' in group_names
  tags:
    - config
    - STPcore

- name: IOS configure some service / disable unused service
  ios_config:
    lines:
      - no ip http server
      - no ip http secure-server
      - service timestamps log datetime msec show-timezone
      - service timestamps debug datetime msec show-timezone
      - vtp mode off
      - errdisable recovery cause bpduguard
  when: ansible_network_os == 'ios'
  tags:
    - config
    - services

- name: IOS configure SNMP
  ios_command:
    commands:
      - configure terminal
      - access-list 98 permit any
      - snmp-server community talend-sw RO 98
      - snmp-server location {{ inventory_hostname[:3]|upper }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - snmp


