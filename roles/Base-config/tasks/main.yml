- name: SSH configuration
  ios_command:
    commands:
      - configure terminal
      - crypto key generate rsa usage-keys label talend modulus 2048
      - ip ssh rsa keypair-name talend
      - ip ssh dh min size 2048
      - ip ssh version 2
      - exit
#    timeout: 120
  vars:
    ansible_command_timeout: 120
  when: ansible_network_os == 'ios'
  tags:
    - config
    - ssh

- name: IOS Login banner
  ios_banner:
    banner: login
    text: |
      *******************************  SECURITY NOTICE  **************************
      *  Use of this system, its equipment, and resources is monitored at all    *
      *  times. All programs and information held on this system are private and *
      *  confidential to Talend, and are only lawfully available to              *
      *  authorised users for authorised purposes only.                          *
      *                                                                          *
      *  It is a criminal offence to obtain unauthorised access to any program   *
      *  or information within this system and/or to make any unauthorised       *
      *  modifications whatsoever to the contents of this computer system.       *
      *                                                                          *
      *  If you are not an authorised user you are violating the regulations of  *
      *  this system and can, and will be prosecuted to the full extent of the   *
      *  law. Please disconnect immediately.                                     *
      ****************************************************************************
    state: present
  tags:
    - config
    - banner

- name: Set IOS Interface Description from CDP
  ios_config:
    lines:
      - description Connected to {{ item.value[0].host }} int {{ item.value[0].port }}
    parents: interface {{ item.key }}
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    - item.value[0].platform is defined
    - ("cisco" in item.value[0].platform)
  tags:
    - config
    - intdescr

- name: Configure interface in vlan 8 - End Users
  ios_config:
    lines:
      - description Wired Users VLAN
      - switchport mode access
      - spanning-tree portfast {{ edge }}
      - no spanning-tree guard loop
      - no spanning-tree bpduguard enable
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and item.access.vlan == 8) or
      (item.mode is not defined and item.access is defined and item.access.vlan == 8)
  tags:
    - config
    - configswitchports8

- name: Configure interface in vlan 24/48 - Ops devices & A/V
  ios_config:
    lines:
      - switchport mode access
      - spanning-tree portfast {{ edge }}
      - no spanning-tree guard loop
      - no spanning-tree bpduguard enable
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and (item.access.vlan == 24 or item.access.vlan == 48)) or
      (item.mode is not defined and item.access.vlan is defined and (item.access.vlan == 24 or item.access.vlan == 48))
  tags:
    - config
    - configswitchports2448

- name: Configure description tags in vlan 24 - Ops devices
  ios_config:
    lines:
      - description VLAN24 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan == 24) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 24)) and
      ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN24 - ') )
  tags:
#    - config
    - configswitchports24

- name: Configure description tags in vlan 48 - Audio/Video
  ios_config:
    lines:
      - description VLAN48 - {{ output.ansible_facts.ansible_net_interfaces[item.name].description }}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ((item.mode is defined and item.mode == 'access' and item.access.vlan == 48) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 48)) and
      ( output.ansible_facts.ansible_net_interfaces[item.name].description is defined and
      not output.ansible_facts.ansible_net_interfaces[item.name].description.startswith('VLAN48 - ') )
  tags:
#    - config
    - configswitchports48


- name: Configure interface for Cisco Meraki
  ios_config:
    lines:
      - description Wifi AP {{ item.value[0].host }}
    #  - switchport trunk native vlan 999
    #  - switchport trunk allowed vlan 16,24,240,999
    #  - switchport mode trunk
    parents: interface {{ item.key }}
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    - item.value[0].platform is defined
    - ("Cisco" in item.value[0].platform)
  tags:
    - config
    - configswitchportswifi


- name: Disable AUX login
  ios_command:
    commands:
      - configure terminal
      - line aux 0
      - transport input none
      - transport output none
      - no exec
      - exec-timeout 0 1
      - no password
      - exit
  ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - disableaux

- name: remove all users except admin
  no_log: true
  ios_user:
    purge: yes
  tags:
    - config
    - removelocalusers
    - configusers

- name: remove all credentials
  ios_command:
    commands:
      - configure terminal
      - no ip ssh pubkey-chain
      - no ip ftp username
      - no enable password
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - removecredentials
    - configusers

- name: Add a user with  hashed password
  no_log: true
  ios_user:
    name: "{{ admin_user }}"
    hashed_password:
      type: 9
      value: "{{ admin_hash_password }}"
      #have to add this value in the vault and remove admin1 its just for testing
  tags:
    - config
    - configadminuser
    - configusers

- name: set multiple users to privilege level 15
  no_log: true
  ios_user:
    aggregate:
      - name: "{{ admin_user }}"
    privilege: 15
    state: present
  tags:
    - config
    - configadminuser
    - configusers

- name: enable secret scrypt
  no_log: true
  ios_command:
    commands:
      - configure terminal
      - enable secret 9 {{ admin_hash_password }}
      #need to create seperate secret jkey and update that in the vault
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - configadminuser
    - configenable

- name: Configure aaa new-model
  ios_config:
    lines:
      - aaa new-model
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: Configure SV2-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_SV2 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key 7 {{ talend_radius_server_key }}
    parents: radius server {{ talend_radius_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: Configure PA7-Radius
  ios_config:
    lines:
      - address ipv4 {{ talend_radius_PA7 }} auth-port {{ talend_radius_auth_port }} acct-port {{ talend_radius_acct_port }}
      - timeout 3
      - key 7 {{ talend_radius_server_key }}
    parents: radius server {{ talend_radius_PA7_name }}
    before: no radius server SUR-Radius
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: Configure Global-Radius-Servers
  ios_config:
    lines:
      - server name {{ talend_radius_1_name }}
      - server name {{ talend_radius_2_name }}
      - deadtime 5
    parents: aaa group server radius Global-Radius-Servers
    before: no aaa group server radius Global-Radius-Servers
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: Configure Radius Global Config
  ios_config:
    lines:
      - aaa authentication login default group Global-Radius-Servers local
      - aaa authorization console
      - aaa authorization exec default group Global-Radius-Servers local
      - aaa accounting exec default start-stop group Global-Radius-Servers
      - aaa accounting system default start-stop group Global-Radius-Servers
      - ip radius source-interface Vlan999
  when: ansible_network_os == 'ios'
  tags:
    - config
    - radius

- name: Save config
  ios_config:
    save_when: always
  when: ansible_network_os == 'ios'
  tags:
    - config
    - saveconfig
