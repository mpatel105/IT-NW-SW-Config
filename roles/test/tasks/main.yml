---
# tasks file for test

- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - test

- debug:
    #msg: "{{ napalmfacts['ansible_facts']['napalm_interface_list'] }}"
    msg: "{{  item.name }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == "ios"
  tags:
    - test



- name: show interface
  cli_command:
    command: "sh run int {{ item.name }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  async: 60
  poll: 10
  register: async_loop
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: Check sync status
  async_status:
    jid: "{{ item.ansible_job_id }}"
    mode: status
  loop: "{{ async_loop.results }}"
  register: async_poll_results
  until: async_poll_results.finished
  retries: 300

- debug:
    msg: "{{ async_loop_jobs }}"

