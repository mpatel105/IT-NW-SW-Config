---
# tasks file for test

- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - test


- debug:
    msg: "{{ item.access.vlan }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == "ios" and item.access is defined and item.access.vlan is defined
  tags:
    - test
