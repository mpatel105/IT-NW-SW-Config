---
# tasks file for test

- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: napalm get_facts
  napalm.napalm.get_facts:
    filter: facts,interfaces,vlans
  register: napalmfacts
  when: ansible_network_os == 'ios'
  tags:
    - interfaces
    - cdplldp
    - new


- debug:
    msg: "{{ napalmfacts }}"
  when:
    - ansible_network_os == "ios"
  tags:
    - test

