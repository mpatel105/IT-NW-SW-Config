- name: IOS - Configure template TEMPLATE_NAC_ENDPOINTS
  ios_config:
    lines:
      - switchport access vlan {{ vlan_blackhole_id }}
      - switchport mode access
      - description NAC Endpoints
    parents: template TEMPLATE_NAC_ENDPOINTS
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_STANDARD_ENDPOINTS
  ios_config:
    lines:
      - switchport access vlan 8
      - switchport mode access
      - description Standard Endpoints (NO NAC)
    parents: template TEMPLATE_STANDARD_ENDPOINTS
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_TRUNK_WIFI_AP
  ios_config:
    lines:
      - switchport mode trunk
      - switchport trunk allowed vlan 16,24,240,999
      - switch trunk native vlan 999
      - description Wifi AP
    parents: template TEMPLATE_TRUNK_WIFI_AP
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_TRUNK_ACCESS_SWITCH
  ios_config:
    lines:
      - switchport mode trunk
      - switchport trunk allowed vlan 8,16,24,40,169,240,999
      - switch trunk native vlan 999
      - description Uplink To Switch
    parents: template TEMPLATE_TRUNK_ACCESS_SWITCH
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_TRUNK_ALL
  ios_config:
    lines:
      - switchport mode trunk
      - switch trunk native vlan 999
      - description Uplink To Core Switch / Firewalls
    parents: template TEMPLATE_TRUNK_ALL
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_CSW
  ios_config:
    lines:
      - switchport mode access
      - switchport access vlan 995
      - description Link to Opengear Console Switch
    parents: template TEMPLATE_CSW
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure template TEMPLATE_PANFW_MGMT
  ios_config:
    lines:
      - switchport mode access
      - switchport access vlan 998
      - description Link to PAN FW MGMT
    parents: template TEMPLATE_PANFW_MGMT
    replace: block
  when:
    - ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - NACglobal

- name: IOS 3650/3850/9x00 - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - device-tracking policy ip_device_tracking_policy
      - tracking enable
      - exit
  when: ansible_network_os == 'ios' and (('3850' in ansible_net_model) or ('3650' in ansible_net_model) or ('9200' in ansible_net_model) or ('9300' in ansible_net_model))
  tags:
    - convertNAC1
    - NACglobal


- name: IOS 2960X/3560CX - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - ip device tracking
      - exit
  when: ansible_network_os == 'ios' and ('2960' in ansible_net_model or '3560' in ansible_net_model)
  tags:
    - convertNAC1
    - NACglobal

- name: IOS - Configure interface for Cisco Meraki
  ios_config:
    lines:
      - source template TEMPLATE_TRUNK_WIFI_AP
    parents: interface {{ item.key }}
    before: default interface {{ item.key }}
    match: exact
  loop: "{{ ansible_net_neighbors | default({}) | dict2items }}"
  when:
    - ansible_network_os == "ios" and (item.value[0].platform is defined and "Meraki" in item.value[0].platform)
  tags:
    - convertNAC1
    - NACglobal

