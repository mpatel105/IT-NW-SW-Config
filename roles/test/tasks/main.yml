---
# tasks file for test

- name: IOS - get facts
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal
    - convertNAC1
    - convertNAC2
    - convertNAC3


- name: napalm get_facts
  napalm.napalm.get_facts:
    filter: facts,interfaces,lldp_neighbors_detail,vlans
  register: napalmfacts
  when: ansible_network_os == 'ios'
  tags:
    - convertNAC1
    - convertNAC2
    - convertNAC3
    - NACglobal
    - napalm

- name: IOS - Configure Blackhole vlan
  ios_vlans:
    config:
      - name: "{{ vlan_blackhole_name }}"
        vlan_id: "{{ vlan_blackhole_id }}"
        state: active
        shutdown: disabled
    state: merged
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal
    - NACinterfaces

- debug:
    msg: "{{ item }}"
  loop: "{{ napalm_vlans['99']['interfaces'] }}"
  ignore_errors: yes
  tags:
    - napalm

