---
# tasks file for Testing
- name: Read in parse_genie role
  include_role:
    name: clay584.parse_genie
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: IOS show interfaces status
  ios_command:
    commands: show interfaces status
  register: result
  vars:
    ansible_command_timeout: 300
  when: ansible_network_os == 'ios'
  tags:
    - test

# - name: Debug show interfaces
#   debug:
#     msg: "{{ result['stdout'][0] }}"
#   delegate_to: localhost
#   when: ansible_network_os == 'ios'
#   tags:
#     - test

- name: Debug Genie Filter
  set_fact:
    int: "{{ result['stdout'][0] | parse_genie(command='show interfaces status', os='ios') }}"
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: Debug Genie Filter Interfaces
  debug:
    var: int
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - test


