---
# tasks file for Testing
- name: Read in parse_genie role
  include_role:
    name: clay584.parse_genie
  tags:
    - test

- name: IOS show interfaces
  ios_command:
    commands: show running-config | section ^interface
  register: result
  vars:
    ansible_command_timeout: 300
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: Debug Genie Filter
  debug:
    msg: "{{ result['stdout'][0] | parse_genie(command='show interfaces', os='ios') }}"
  delegate_to: localhost
  tags:
    - test
