##############################################################################################
### Create device YAML file
##############################################################################################
- name: IOS show interfaces
  ios_command:
    commands: show running-config | section ^interface
  register: result
  vars:
    ansible_command_timeout: 300
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: Debug show interfaces
  debug:
    msg: "{{ result['stdout'][0] }}"
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: Debug Genie Filter
  debug:
    msg: "{{ result['stdout'][0] | parse_genie(command='show running-config | section ^interface', os='ios') }}"
  register: result2
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: clone repository
  run_once: true
  git:
    repo: "https://{{awx_user_github}}:{{awx_pwd_github}}@github.com/TalendIT/IT-Network-Scripts.git"
    dest: "{{ dest_folder }}"
    force: yes
    version: testing
  tags:
    - test

- name: create new inventory file
  file:
    state: touch
    path: "{{ dest_folder }}/{{ inventory_hostname }}.yml"
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: copy to file
  copy:
    dest: "{{ dest_folder }}/{{ inventory_hostname }}.yml"
    content: "{{ result2.msg | to_nice_yaml }}"
#    content: "{{ result2.msg }}"
  delegate_to: localhost
  when: ansible_network_os == 'ios'
  tags:
    - test

- name: push to git
  run_once: true
  shell: |
    git config --global user.email "networks@talend.com"
    git config --global user.name "sa-netgit"
    git add .
    git commit -m "testing: $(date +"%Y-%m-%d %H:%M:%S")"
    git push
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - test

##############################################################################################
### read device YAML files
##############################################################################################

- name: read YAML file
  debug:
    msg: "{{ item.value.source_template }}"
  loop: "{{ interfaces | default({}) | dict2items }}"
  when: ansible_network_os == 'ios' and item.value.source_template is defined
  tags:
    - read

- name: IOS - Configure Interfaces from template
  ios_config:
    lines:
      - source template {{ item.value.source_template }}
    parents: interface {{ item.key }}
    before: default interface {{ item.key }}
    match: exact
  loop: "{{ interfaces | default({}) | dict2items }}"
  when:
    - ansible_network_os == 'ios' and item.value.source_template is defined
  tags:
    - writeTEMPLATE

- name: IOS - Configure Port-Channel
  ios_config:
    lines:
      - "{% if item.value.description is defined %}description {{ item.value.description }}{% endif %}"
      - "{% if item.value.switchport_mode is defined %}switchport mode {{ item.value.switchport_mode }}{% endif %}"
      - "{% if item.value.switchport_trunk_vlans is defined %}switchport trunk allowed vlan {{ item.value.switchport_trunk_vlans }}{% endif %}"
      - "{% if item.value.switchport_access_vlan is defined %}switchport access vlan {{ item.value.switchport_access_vlan }}{% endif %}"
      - "{% if item.value.switchport_mode is defined %}switchport mode {{ item.value.switchport_mode }}{% endif %}"
      - "{% if item.value.switchport_trunk_native_vlan is defined %}switchport trunk native vlan {{ item.value.switchport_trunk_native_vlan }}{% endif %}"
      - "{% if item.value.shutdown is defined and item.value.shutdown %}shutdown{% endif %}"
      - "{% if item.value.shutdown is defined and  not item.value.shutdown %}no shutdown{% endif %}"
    parents: interface {{ item.key }}
  loop: "{{ interfaces | default({}) | dict2items }}"
  when:
    - ansible_network_os == 'ios' and 'Port-channel' in item.key
  tags:
    - writeTRUNK

- name: IOS - Configure interface channel-group
  ios_config:
    lines:
      - "{% if item.value.description is defined %}description {{ item.value.description }}{% endif %}"
      - "channel-group {{ item.value.channel_group.chg }} mode {{ item.value.channel_group.mode }}"
    parents: interface {{ item.key }}
  loop: "{{ interfaces | default({}) | dict2items }}"
  when:
    - ansible_network_os == 'ios' and item.value.channel_group is defined
  tags:
    - writeCHANNEL
