---
# tasks file for NAC-switch-config

- name: Configure NAC for global config
  ios_command:
    commands:
      - configure terminal
      - aaa new-model
      - aaa authentication dot1x default group Portnox-RADIUS-group
      - aaa authorization network default group Portnox-RADIUS-Group
      - aaa accounting update newinfo periodic 2880
      - aaa accounting dot1x default start-stop group Portnox-RADIUS-Group
      - aaa group server radius Portnox-RADIUS-Group
      - server name {{ talend_portnox_1_name }}
      - server name {{ talend_portnox_2_name }}
      - deadtime 5
      - aaa server radius dynamic-author
      - client {{ talend_portnox_1 }} server-key 7 {{ talend_CoA_radius_server_key_1 }}
      - client {{ talend_portnox_2 }} server-key 7 {{ talend_CoA_radius_server_key_2 }}
      - ip radius source-interface Vlan999
      - radius server {{ talend_portnox_1_name }}
      - address ipv4 {{ talend_portnox_1 }} auth-port {{ talend_portnox_auth_port_1 }} acct-port {{ talend_portnox_acct_port_1 }}
      - timeout 3
      - key 7 {{ talend_portnox_radius_key_1 }}
      - radius server {{ talend_portnox_2_name }}
      - address ipv4 {{ talend_portnox_2 }} auth-port {{ talend_portnox_auth_port_2 }} acct-port {{ talend_portnox_acct_port_2 }}
      - timeout 3
      - key 7 {{ talend_portnox_radius_key_2 }}
      - radius-server vsa send authentication
      - radius-server vsa send accounting
      - radius-server dead-criteria time 10 tries 3
      - radius-server deadtime 5
      # commented because doesn't work on lab IOSv
      #- device-tracking policy ip_device_tracking_policy
      #- tracking enable
      - dot1x system-auth-control
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - nacglobal
    - configNAC

- name: IOS get fact
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  tags:
    - nacint
    - get_fact
    - configNAC


- debug:
    msg: "{{ item }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == "ios"
  tags:
    - configNAC
    - nacint

- name: Configure interface for NAC
  ios_config:
    lines:
      - authentication event fail action next-method
      #- authentication event server dead action reinitialize vlan 8
      - authentication timer reauthenticate server
      - authentication timer inactivity server
      - authentication open
      - authentication order dot1x mab
      - authentication priority dot1x mab
      - authentication port-control auto
      - authentication violation restrict
      - authentication periodic
      - mab
      - dot1x pae authenticator
      - dot1x timeout tx-period 10
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and (item.access.vlan == 8 or item.access.vlan == 16 or item.access.vlan == 24 or item.access.vlan == 48)
  tags:
    - nacint
    - configNAC
