---
# tasks file for NAC-switch-config

- name: IOS - get fact
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  tags:
    - NACinterfaces
    - NACglobal
    - shutnoshut
    - track

- name: IOS - Configure Quarantine vlan
  ios_vlans:
    config:
      - name: "{{ vlan_quarantine_name }}"
        vlan_id: "{{ vlan_quarantine_id }}"
        state: active
        shutdown: disabled
    state: merged
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal
    - NACinterfaces

- name: IOS - Configure Blackhole vlan
  ios_vlans:
    config:
      - name: "{{ vlan_blackhole_name }}"
        vlan_id: "{{ vlan_blackhole_id }}"
        state: active
        shutdown: disabled
    state: merged
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal
    - NACinterfaces

- name: NXOS - Configure Quarantine vlan
  nxos_vlans:
    config:
      - name: "{{ vlan_quarantine_name }}"
        vlan_id: "{{ vlan_quarantine_id }}"
        state: active
        enabled: yes
    state: merged
  when: ansible_network_os == 'nxos'
  tags:
    - NACglobal
    - NACinterfaces

- name: IOS - Configure NAC - new-model
  ios_command:
    commands:
      - configure terminal
      - aaa new-model
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure Portnox-Radius-SV2
  ios_config:
    lines:
      - address ipv4 {{ talend_portnox_SV2 }} auth-port {{ talend_portnox_auth_port }} acct-port {{ talend_portnox_acct_port }}
      - timeout 3
      - key {{ talend_portnox_SV2_radius_key }}
    parents: radius server {{ talend_portnox_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure Portnox-Radius-PA7
  ios_config:
    lines:
      - address ipv4 {{ talend_portnox_PA7 }} auth-port {{ talend_portnox_auth_port }} acct-port {{ talend_portnox_acct_port }}
      - timeout 3
      - key {{ talend_portnox_PA7_radius_key }}
    parents: radius server {{ talend_portnox_PA7_name }}
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC group Portnox-RADIUS-Group
  ios_config:
    lines:
      - server name {{ talend_portnox_1_name }}
      - server name {{ talend_portnox_2_name }}
      - deadtime 5
    parents: aaa group server radius Portnox-RADIUS-Group
    before: no aaa group server radius Portnox-RADIUS-Group
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC server radius dynamic-author
  ios_config:
    lines:
      - client {{ talend_portnox_1 }} server-key {{ talend_portnox_1_radius_key }}
      - client {{ talend_portnox_2 }} server-key {{ talend_portnox_2_radius_key }}
    parents: aaa server radius dynamic-author
    before: no aaa server radius dynamic-author
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC - global config
  ios_command:
    commands:
      - configure terminal
      - aaa authentication dot1x default group Portnox-RADIUS-Group
      - aaa authorization network default group Portnox-RADIUS-Group
      - aaa accounting update newinfo periodic 2880
      - aaa accounting dot1x default start-stop group Portnox-RADIUS-Group
      - ip radius source-interface Vlan999
      - radius-server vsa send authentication
      - radius-server vsa send accounting
      - radius-server dead-criteria time 10 tries 3
      - radius-server deadtime 5
      - dot1x system-auth-control
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS 3650/3850/9x00 - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - device-tracking policy ip_device_tracking_policy
      - tracking enable
      - exit
  when: ansible_network_os == 'ios' and (('3850' in ansible_net_model) or ('3650' in ansible_net_model) or ('9200' in ansible_net_model) or ('9300' in ansible_net_model))
  tags:
    - NACglobal


- name: IOS 2960X/3560CX - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - ip device tracking
      - exit
  when: ansible_network_os == 'ios' and ('2960' in ansible_net_model or '3560' in ansible_net_model)
  tags:
    - NACglobal

- debug:
    msg: "{{ ansible_net_interfaces[item.name].description }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.access.vlan is defined and (item.access.vlan == 8 or item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48))
  tags:
    - NACinterfaces

- name: "Configure {{ macro_dot1x_name }} macro"
  ios_config:
    lines: "{{ macro_dot1x_corp }}"
    parents: "macro name {{ macro_dot1x_name }}"
    after: '@'
    match: line
    replace: block
  when: ansible_network_os == 'ios'
  tags:
    - NACinterfaces

- name: IOS - Configure interface for NAC using macro
  ios_config:
    lines:
      - macro apply {{ macro_dot1x_name }} VLAN {% if
          ansible_net_interfaces[item.name].description.startswith('Wired Users VLAN') %}8
          {% elif ansible_net_interfaces[item.name].description.startswith('VLAN24') %}24
          {% elif ansible_net_interfaces[item.name].description.startswith('VLAN40') %}40
          {% elif ansible_net_interfaces[item.name].description.startswith('VLAN48') %}48
          {% else %}{{ vlan_quarantine_id }}{% endif %}
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - ansible_network_os == 'ios' and item.access.vlan is defined and
      (item.access.vlan == 99 or item.access.vlan == 169 or item.access.vlan == 8 or item.access.vlan == 24 or item.access.vlan == 40 or item.access.vlan == 48)
  tags:
    - NACinterfaces

