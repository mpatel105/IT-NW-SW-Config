---
# tasks file for NAC-switch-config

- name: IOS - get fact
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  tags:
    - NACinterfaces
    - NACglobal

- name: IOS - Configure NAC - new-model
  ios_command:
    commands:
      - configure terminal
      - aaa new-model
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure Portnox-Radius-SV2
  ios_config:
    lines:
      - address ipv4 {{ talend_portnox_SV2 }} auth-port {{ talend_portnox_auth_port }} acct-port {{ talend_portnox_acct_port }}
      - timeout 3
      - key {{ talend_portnox_SV2_radius_key }}
    parents: radius server {{ talend_portnox_SV2_name }}
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure Portnox-Radius-PA7
  ios_config:
    lines:
      - address ipv4 {{ talend_portnox_PA7 }} auth-port {{ talend_portnox_auth_port }} acct-port {{ talend_portnox_acct_port }}
      - timeout 3
      - key {{ talend_portnox_PA7_radius_key }}
    parents: radius server {{ talend_portnox_PA7_name }}
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC group Portnox-RADIUS-Group
  ios_config:
    lines:
      - server name {{ talend_portnox_1_name }}
      - server name {{ talend_portnox_2_name }}
      - deadtime 5
    parents: aaa group server radius Portnox-RADIUS-Group
    before: no aaa group server radius Portnox-RADIUS-Group
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC server radius dynamic-author
  ios_config:
    lines:
      - client {{ talend_portnox_1 }} server-key {{ talend_portnox_1_radius_key }}
      - client {{ talend_portnox_2 }} server-key {{ talend_portnox_2_radius_key }}
    parents: aaa server radius dynamic-author
    before: no aaa server radius dynamic-author
    match: exact
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS - Configure NAC - global config
  ios_command:
    commands:
      - configure terminal
      - aaa authentication dot1x default group Portnox-RADIUS-group
      - aaa authorization network default group Portnox-RADIUS-Group
      - aaa accounting update newinfo periodic 2880
      - aaa accounting dot1x default start-stop group Portnox-RADIUS-Group
      - ip radius source-interface Vlan999
      - radius-server vsa send authentication
      - radius-server vsa send accounting
      - radius-server dead-criteria time 10 tries 3
      - radius-server deadtime 5
      - dot1x system-auth-control
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - NACglobal


- name: IOS 3650/3850/9200 - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - device-tracking policy ip_device_tracking_policy
      - tracking enable
      - exit
  when: ansible_network_os == 'ios' and (('3850' in ansible_net_model) or ('3650' in ansible_net_model) or ('9200' in ansible_net_model))
  tags:
    - NACglobal


- name: IOS 2960X/3560CX - Configure NAC - global config device tracking
  ios_command:
    commands:
      - configure terminal
      - ip device tracking
      - exit
  when: ansible_network_os == 'ios' and ('2960' in ansible_net_model or '3560' in ansible_net_model)
  tags:
    - NACglobal

- debug:
    msg: "{{ item }}"
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.access.vlan is defined and (item.access.vlan == 8 or item.access.vlan == 24 or item.access.vlan == 48))
  tags:
    - NACinterfaces

- name: Configure interface for NAC
  ios_config:
    lines:
      - authentication event fail action next-method
      #- authentication event server dead action reinitialize vlan "{% if item.description.startswith('Wired Users VLAN') %}8{% elif item.description.startswith('VLAN24') %}24{% elif item.description.startswith('VLAN48') %}48{% else %}169{% endif %}"
      - authentication timer reauthenticate server
      - authentication timer inactivity server
      - authentication open
      - authentication order dot1x mab
      - authentication priority dot1x mab
      - authentication port-control auto
      - authentication violation restrict
      - authentication periodic
      - mab
      - dot1x pae authenticator
      - dot1x timeout tx-period 10
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.access.vlan is defined and (item.access.vlan == 8 or item.access.vlan == 24 or item.access.vlan == 48))
  tags:
    - NACinterfaces
