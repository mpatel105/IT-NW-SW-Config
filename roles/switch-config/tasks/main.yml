---
# tasks file for switch-config
#
- name: IOS configure name servers
  ios_system:
    name_servers: "{{ emea_region_dns }}"
  when: ansible_network_os == 'ios'
  tags:
    - config

- name: IOS configure hostname and domain name
  ios_system:
#    hostname: "{{ inventory_hostname }}"
    domain_name: networklab.com
    lookup_source: vlan100
    lookup_enabled: yes 
  when: ansible_network_os == 'cisco.ios'
  tags:
    - config


