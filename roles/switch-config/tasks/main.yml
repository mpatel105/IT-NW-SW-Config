---
# tasks file for switch-config
#
- name: IOS configure dns
  ios_system:
#    hostname: "{{ inventory_hostname }}"
    domain_name: networklab.com
    lookup_source: vlan100
    lookup_enabled: yes
    name_servers: "{{ talend_dns }}"
  when: ansible_network_os == 'ios'
  tags:
    - config
    - dns

- name: IOS configure NTP servers
# cisco.ios.ios_ntp_global:
#   config:
#     servers:
#       - server: ntp.talend.com
#     source: vlan100
#     state: replaced
  ios_ntp:
    server: "{{ talend_ntp }}"
    source_int: vlan100
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - config
    - ntp

- name: IOS UTC Timezone
  ios_command:
    commands:
      - configure terminal
      - "clock timezone UTC 0 0"
      - "no clock summer-time"
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - clock

- name: IOS configure some service / disable unused service
  ios_command:
    commands:
      - configure terminal
      - no ip http server
      - no ip http secure-server
      - no ip http authentication
      - service timestamps log datetime msec show-timezone
      - service timestamps debug datetime msec show-timezone
      - vtp mode off
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - services

- name: IOS configure SNMP
  ios_command:
    commands:
      - configure terminal
      - access-list 98 permit any
      - snmp-server community talend-sw RO 98
      - snmp-server location {{ inventory_hostname[:3]|upper }}
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - snmp

- name: IOS configure logging
#  cisco.ios.ios_logging_global:
#    config:
#      buffered:
#      size: 16384
#    severity: notifications
#  console:
#        severity: critical
  ios_command:
    commands:
      - configure terminal
      - no logging monitor
      - no logging console
#      - no logging host 192.168.30.145
#      - no logging host 192.168.15.55
#      - no logging host 192.168.100.211
#      - no logging host 10.42.150.250
      - logging buffered 16384
      - logging host tal-ip121.talend.com
      - logging source-interface Vlan999
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - logs

- name: SSH configuration
  ios_command:
    commands:
      - configure terminal
      - crypto key generate rsa usage-keys label talend modulus 2048
      - ip ssh rsa keypair-name talend
      - ip ssh dh min size 2048
      - ip ssh version 2
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - ssh
- name: IOS Login banner
  ios_banner:
    banner: login
    text: |
      *******************************  SECURITY NOTICE  **************************
      *  Use of this system, its equipment, and resources is monitored at all    *
      *  times. All programs and information held on this system are private and *
      *  confidential to Talend, and are only lawfully available to              *
      *  authorised users for authorised purposes only.                          *
      *                                                                          *
      *  It is a criminal offence to obtain unauthorised access to any program   *
      *  or information within this system and/or to make any unauthorised       *
      *  modifications whatsoever to the contents of this computer system.       *
      *                                                                          *
      *  If you are not an authorised user you are violating the regulations of  *
      *  this system and can, and will be prosecuted to the full extent of the   *
      *  law. Please disconnect immediately.                                     *
      ****************************************************************************
    state: present
  tags:
    - config
    - banner

- name: IOS get fact
  ios_facts:
    gather_network_resources:
      - 'l2_interfaces'
  register: output
  tags:
    - config
    - get_fact
    - get_fact_debug
    - intdescr
    - endusers
    - wifi


- debug:
    #msg: "host is {{ item.value[0].host }} and platform is {{ item.value[0].platform }}"
    # msg: "host is {{ item.value[0] }} "
    msg: "{{ output.ansible_facts.ansible_net_neighbors | type_debug }}"
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    #- item.value[0].platform is defined
    #- ("Cisco" in item.value[0].platform)
  tags:
    - config
    - get_fact_debug


- name: Set IOS Interface Description from CDP
  ios_config:
    lines:
      - description Connected to {{ item.value[0].host }} int {{ item.value[0].port }}
    parents: interface {{ item.key }}
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    - item.value[0].platform is defined
    - ("Cisco" in item.value[0].platform)
  tags:
    - config
    - intdescr

- name: Configure interface in vlan 8 - End Users
  ios_config:
    lines:
      - description End User Vlan
      - switchport mode access
      - spanning-tree portfast edge
      - no spanning-tree guard loop
      - no spanning-tree bpduguard enable
    parents: interface {{ item.name }}
  loop: "{{ ansible_network_resources['l2_interfaces']  }}"
  when:
    - (item.mode is defined and item.mode == 'access' and item.access.vlan == 300) or
      (item.mode is not defined and item.access.vlan is defined and item.access.vlan == 300)
  tags:
    - config
    - endusers

- name: Configure interface for Cisco Meraki
  ios_config:
    lines:
      - description Wifi AP {{ item.value[0].host }}
    #  - switchport trunk native vlan 999
    #  - switchport trunk allowed vlan 16,24,240,999
    #  - switchport mode trunk
    parents: interface {{ item.key }}
  loop: "{{ output.ansible_facts.ansible_net_neighbors | dict2items }}"
  when:
    - ansible_network_os == "ios"
    - item.value[0].platform is defined
    - ("Cisco" in item.value[0].platform)
  tags:
    - config
    - wifi


- name: Disable AUX login
  ios_command:
    commands:
      - configure terminal
      - line aux 0
      - transport input none
      - transport output none
      - no exec
      - exec-timeout 0 1
      - no password
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - aux

- name: Error recovery
  ios_command:
    commands:
      - configure terminal
      - errdisable recovery cause bpduguard
      - exit
  when: ansible_network_os == 'ios'
  tags:
    - config
    - error

- name: remove all users except admin
  ios_user:
    purge: yes
  tags:
    - config
    - remove

- name: remove all credentials
  ios_command:
    commands:
      - configure terminal
      - no ip ssh pubkey-chain
      - no ip ftp username
      - no enable password
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - remove

- name: Add a user with  hashed password
  ios_user:
    name: admin1
    hashed_password:
      type: 9
      value: $9$WnArItcQHW/uuE$x5WTLbu7PbzGDuv0fSwGKS/KURsy5a3WCQckmJp0MbE
      #have to add this value in the vault and remove admin1 its just for testing
  tags:
    - config
    - add

- name: set multiple users to privilege level 15
  ios_user:
    aggregate:
      - name: admin1
    privilege: 15
    state: present
  tags:
    - config
    - addprivilege

- name: enable secret scrypt
  ios_command:
    commands:
      - configure terminal
      - enable algorithm-type scrypt secret admin
      #need to create seperate secret jkey and update that in the vault
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - secret

- name: STP Global configuration
  ios_command:
    commands:
      - configure terminal
      - spanning-tree mode Rapid-pvst
      - spanning-tree extend system-id
      - spanning-tree portfast bpduguard default
      - spanning-tree vlan 1-4094 priority 32768
      - exit
  # ignore_errors: yes
  when: ansible_network_os == 'ios'
  tags:
    - config
    - STP
