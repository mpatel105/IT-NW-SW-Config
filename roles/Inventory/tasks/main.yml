---

- name: IOS get fact
  ios_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'ios'

- name: NXOS get fact
  nxos_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'nxos'

- name: define OS Version
  set_fact:
    os_version: "{% if ('3850' in ansible_net_model) or ('3650' in ansible_net_model) %}{{ cat3x50_version }}{% elif '2960' in ansible_net_model %}{{ cat2960_version }}{% elif '9200' in ansible_net_model %}{{ cat9200_version }}{% elif '3560' in ansible_net_model %}{{ cat3560_version }}{% elif 'Nexus' in ansible_net_model %}{{ nxos_version }}{% else %}{% endif %}"
  tags:
    - inventory
    - inventory_test

- name: clone repository
  run_once: true
  git: >
    repo=https://{{awx_user_github}}:{{awx_pwd_github}}@github.com/TalendIT/IT-Network-Scripts.git
    dest="{{ dest_folder }}"
    force=yes
  tags:
    - inventory

- name: deleting inventory file
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}/inventory.csv"
  tags:
    - inventory

- name: create new inventory file
  run_once: true
  file:
    state: touch
    path: "{{ dest_folder}}/inventory.csv"
  tags:
    - inventory

- name: writing to file
  ansible.builtin.lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: "{{ ansible_net_hostname[:3]|upper }},
           {{ ansible_net_hostname }}{% if ansible_net_stacked_models is defined and (ansible_net_stacked_models | length) > 1  %}_{{ansible_loop.index}}{% else %}{% endif %},
           {{ item }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0] | default(ansible_net_serialnum) }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0][3:5] | default(ansible_net_serialnum[3:5]) | int + 1996 }},
           {{ ansible_net_iostype | default('NXOS') }},
           {{ ansible_net_version }},
           {% if ansible_net_version == os_version %}-{% else %}Yes{% endif %}"
    create: yes
  loop: "{{ ansible_net_stacked_models | default ([ansible_net_model]) }}"
  loop_control:
    extended: yes
  throttle: 1
  tags:
    - inventory

- name: sort inventory file
  run_once: true
  shell:
    cmd: "sort -t, -k1n >> inventory2.csv"
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: add header
  run_once: true
  lineinfile:
    path: "{{ dest_folder}}/inventory2.csv"
    line: Site,Hostname,Model,Serial_Number,Year,OS_Type,OS_Version,Upgrade_Needed
    insertbefore: BOF
  tags:
    - inventory

- name: push to git
  run_once: true
  shell: |
    git add .
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: remove temp folder
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}"
  tags:
    - inventory

- debug:
    msg: "Inventory done"
  run_once: true
  tags:
    - inventory
