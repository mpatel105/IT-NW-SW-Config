---

- name: IOS get fact
  ios_facts:
  tags:
    - inventory
  when: ansible_network_os == 'ios'

- name: NXOS get fact
  nxos_facts:
  tags:
    - inventory
  when: ansible_network_os == 'nxos'

- name: clone repository
  run_once: true
  git: >
    repo=https://{{awx_user_github}}:{{awx_pwd_github}}@github.com/TalendIT/IT-Network-Scripts.git
    dest="{{ dest_folder }}"
    force=yes
  tags: inventory

- name: create new inventory file
  run_once: true
  file:
    state: touch
    path: "{{ dest_folder}}/inventory.csv"
  tags: inventory

- name: add header
  run_once: true
  lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: Site,Hostname,Model,Serial_Number,Year,OS_Type,OS_Version
    create: yes

- name: writing to file
  ansible.builtin.lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: "{{ item }}"
      # "{{ ansible_net_hostname[:3]|upper }},
      #     {{ ansible_net_hostname }},
      #     {{ item }},
      #     {{ ansible_net_stacked_serialnums }},
      #     {{ ansible_net_serialnum[3:5] | int + 1996 }},
      #     {{ansible_net_iostype | default(' ') }},
      #     {{ ansible_net_version }}"
    create: yes
    loop: "{{ ansible_net_stacked_models }}"
    loop_control:
      loop_var: ansible_net_stacked_models
  tags:
    - inventory

- name: push to git
  run_once: true
  shell: |
    git add .
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: remove temp folder
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}"
  tags:
    - inventory
