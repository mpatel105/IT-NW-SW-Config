---

- name: IOS get fact
  ios_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'ios'

- name: NXOS get fact
  nxos_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'nxos'

- name: clone repository
  run_once: true
  git: >
    repo=https://{{awx_user_github}}:{{awx_pwd_github}}@github.com/TalendIT/IT-Network-Scripts.git
    dest="{{ dest_folder }}"
    force=yes
  tags:
    - inventory

- name: deleting inventory file
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}/inventory.csv"
  tags:
    - inventory

- name: create new inventory file
  run_once: true
  file:
    state: touch
    path: "{{ dest_folder}}/inventory.csv"
  tags:
    - inventory

- name: add header
  run_once: true
  lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: Site,Hostname,Model,Serial_Number,Year,OS_Type,OS_Version
    create: yes
  tags:
    - inventory

- name: writing to list
  set_fact:
    inventory_list: "{{ inventory_list }} + [ '{{ ansible_net_hostname[:3]|upper }},
           {{ ansible_net_hostname }}{% if ansible_net_stacked_models is defined and (ansible_net_stacked_models | length) > 1  %}_{{ansible_loop.index}}{% else %}{% endif %},
           {{ item }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0] | default(ansible_net_serialnum) }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0][3:5] | default(ansible_net_serialnum[3:5]) | int + 1996 }},
           {{ ansible_net_iostype | default('NXOS') }},
           {{ ansible_net_version }}' ]"
  loop: "{{ ansible_net_stacked_models | default ([ansible_net_model]) }}"
  loop_control:
    extended: yes
  throttle: 1
  delegate_to: localhost
  tags:
    - inventory
    - inventory_test

- name: show inventory
  run_once: true
  debug: var={{ hostvars['localhost']['inventory_list'] }}"
  tags:
    - inventory
    - inventory_test

