---
# tasks file for Inventory

- name: IOS get fact
  ios_facts:
  tags:
    - inventory
  when: ansible_network_os == 'ios'

- name: NXOS get fact
  nxos_facts:
  tags:
    - inventory
  when: ansible_network_os == 'nxos'

- debug:
    msg: "{{ ansible_net_hostname }};{{ ansible_net_model }};{{ ansible_net_serialnum }};{{ ansible_net_version }}"
  tags:
    - debuginventory

- name: clone repository
  git: >
    repo=https://{{awx_user_github}}:{{awx_pwd_github}}@github.com/TalendIT/IT-Network-Scripts.git
    dest="{{ dest_folder }}"
    force=yes
  tags: inventory

- name: create new inventory file
  file:
    state: touch
    path: "{{ dest_folder}}/inventory.csv"
  tags: inventory

- name: add header
  lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: Hostname,Model,Serial_Number,OS_Version
    create: yes

- name: writing to file
  ansible.builtin.lineinfile:
    path: "{{ dest_folder}}/inventory.csv"
    line: "{{ ansible_net_hostname }},{{ ansible_net_model }},{{ ansible_net_serialnum }},{{ ansible_net_version }}"
    create: yes
  when:
    - ansible_network_os == "ios"
  tags:
    - inventory

- name: push to git
  shell: |
    git add .
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: remove temp folder
  file:
    state: absent
    path: "{{ dest_folder}}"
  tags:
    - inventory
