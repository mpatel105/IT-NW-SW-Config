- name: push to git
  run_once: true
  shell: |
    git add .
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: remove temp folder
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}"
  tags:
    - inventory

- debug:
    msg: "Inventory done"
  run_once: true
  tags:
    - inventory
