---

- name: IOS get fact
  ios_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'ios'

- name: NXOS get fact
  nxos_facts:
    gather_subset: hardware
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'nxos'

- name: PANOS get fact
  paloaltonetworks.panos.panos_op:
    provider: '{{ device }}'
    cmd: 'show system info'
  register: res
  tags:
    - pan
    - pantest
  when: ansible_network_os == 'panos'

- debug:
    msg: '{{ res.stdout }}'
  tags:
    - pan
    - pantest
  when: ansible_network_os == 'panos'

- debug:
    msg: '{{ res.result }}'
  tags:
    - pan
    - pantest
  when: ansible_network_os == 'panos'

- name: define OS Version
  set_fact:
    os_version: "{% if ('3850' in ansible_net_model) or ('3650' in ansible_net_model) %}{{ cat3x50_version }}{% elif '2960' in ansible_net_model %}{{ cat2960_version }}{% elif '9200' in ansible_net_model %}{{ cat9200_version }}{% elif '9300' in ansible_net_model %}{{ cat9300_version }}{% elif '3560' in ansible_net_model %}{{ cat3560_version }}{% elif 'Nexus' in ansible_net_model %}{{ nxos_version }}{% else %}{% endif %}"
  tags:
    - inventory
    - inventory_test
  when: ansible_network_os == 'ios' or ansible_network_os == 'nxos'

- name: clone repository
  run_once: true
  git:
    repo: "https://{{awx_user_github}}:{{awx_pwd_github}}@{{repo}}"
    dest: "{{ dest_folder }}"
    force: yes
    version: master
  tags:
    - inventory
    - pan
    - pantest

- name: deleting inventory file
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder }}/{{ inventory_file }}"
  tags:
    - inventory

- name: PANOS deleting inventory file
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder }}/{{ panos_inventory_file }}"
  tags:
    - pan
    - pantest

- name: create new inventory file
  run_once: true
  file:
    state: touch
    path: "{{ dest_folder }}/temp.csv"
  tags:
    - inventory

- name: PANOS create new panos inventory file
  run_once: true
  file:
    state: touch
    path: "{{ dest_folder }}/panostemp.csv"
  tags:
    - pan
    - pantest

- name: writing to file
  ansible.builtin.lineinfile:
    path: "{{ dest_folder}}/temp.csv"
    line: "{{ ansible_net_hostname[:3]|upper }},
           {{ ansible_net_hostname }}{% if ansible_net_stacked_models is defined and (ansible_net_stacked_models | length) > 1  %}_{{ansible_loop.index}}{% else %}{% endif %},
           {{ item }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0] | default(ansible_net_serialnum) }},
           {{ ansible_net_stacked_serialnums[ansible_loop.index0][3:5] | default(ansible_net_serialnum[3:5]) | int + 1996 }},
           {{ ansible_net_iostype | default('NXOS') }},
           {{ ansible_net_version }},
           {% if ansible_net_version == os_version %}-{% else %}Yes{% endif %}"
    create: yes
  loop: "{{ ansible_net_stacked_models | default ([ansible_net_model]) }}"
  loop_control:
    extended: yes
  throttle: 1
  when: ansible_network_os == 'ios' or ansible_network_os == 'nxos'
  tags:
    - inventory

# - name: PANOS writing to file
#   ansible.builtin.lineinfile:
#     path: "{{ dest_folder}}/panostemp.csv"
#     line: "'{{ res.system }}'
#            "
#     create: yes
#   tags:
#     - pan
#   when: ansible_network_os == 'panos'

- name: sort inventory file
  run_once: true
  shell:
    cmd: "sort -t, -k1n temp.csv >> {{ inventory_file }}"
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory

- name: add header
  run_once: true
  lineinfile:
    path: "{{ dest_folder }}/{{ inventory_file }}"
    line: Site,Hostname,Model,Serial_Number,Year,OS_Type,OS_Version,Upgrade_Needed
    insertbefore: BOF
  tags:
    - inventory

- name: push to git
  run_once: true
  shell: |
    git config --global user.email "networks@talend.com"
    git config --global user.name "sa-netgit"
    git add {{ inventory_file }}
    git add {{ panos_inventory_file }}
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - inventory
    - pan

- name: remove temp folder
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder}}"
  tags:
    - inventory
    - pan

- debug:
    msg: "Inventory done"
  run_once: true
  tags:
    - inventory
    - pan
