---
# tasks file for Cisco-contract

# GET TOKEN #
- name: PUT Get Token
  uri:
    url: https://id.cisco.com/oauth2/default/v1/token?grant_type=client_credentials&client_id={{cisco_api_client_id}}&client_secret={{cisco_api_client_secret}}
    headers:
      Accept: application/json
      Content-Type: application/x-www-form-urlencoded
      host: id.cisco.com
    method: POST
    return_content: yes
    validate_certs: no
    force_basic_auth: yes
    follow_redirects: yes
    body_format: json
  register: token
  delegate_to: localhost
  no_log: true
  run_once: true
  tags:
    - serial2info
    - serial2info_all
    - serial2info_netbox

# SET TOKEN #
- name: Set JSON
  set_fact:
    token_type: "{{ token.json.token_type }}"
    access_token: "{{ token.json.access_token }}"
  delegate_to: localhost
  tags:
    - serial2info
    - serial2info_all
    - serial2info_netbox

# GET SERIAL 2 INFO #

