---
# tasks file for Cisco-contract

- name: IOS - get facts
  ios_facts:
    gather_subset: min
  register: output
  when: ansible_network_os == 'ios'
  tags:
    - serial2info


# GET TOKEN #
- name: PUT Get Token
  uri:
    url: https://id.cisco.com/oauth2/default/v1/token?grant_type=client_credentials&client_id={{cisco_api_client_id}}&client_secret={{cisco_api_client_secret}}
    headers:
      Accept: application/json
      Content-Type: application/x-www-form-urlencoded
      host: id.cisco.com
    method: POST
    return_content: yes
    validate_certs: no
    force_basic_auth: yes
    follow_redirects: yes
    body_format: json
  register: token
  delegate_to: localhost
  no_log: true
  run_once: true
  tags:
    - serial2info
    - serial2info_all

# SET TOKEN #
- name: Set JSON
  set_fact:
    token_type: "{{ token.json.token_type }}"
    access_token: "{{ token.json.access_token }}"
  delegate_to: localhost
  tags:
    - serial2info
    - serial2info_all

# GET SERIAL 2 INFO #
- name: GET Serial to Info1
  uri:
    url: https://apix.cisco.com/sn2info/v2/coverage/summary/serial_numbers/{{ ansible_net_serialnum }}
    method: GET
    headers:
      Authorization: "{{token_type}} {{access_token}}"
      Cache-Control: no-cache
      Accept-Encoding: gzip, deflate, br
      Connection: keep-alive
      Accept: application/json
    return_content: yes
    validate_certs: no
    force_basic_auth: yes
    follow_redirects: yes
  register: Serial2Info
  tags:
    - serial2info

- debug:
    msg: "{{ hostvars[item]['serial'] }}"
  loop: "{{ groups['cisco'] }}"
  delegate_to: localhost
  tags:
    - serial2info_all

- name: clone repository
  run_once: true
  git:
    repo: "https://{{awx_user_github}}:{{awx_pwd_github}}@{{repo}}"
    dest: "{{ dest_folder }}"
    force: yes
    version: master
  tags:
    - serial2info_all

- name: deleting inventory file
  run_once: true
  file:
    state: absent
    path: "{{ dest_folder }}/{{ inventory_file }}"
  tags:
    - serial2info_all

# GET SERIAL 2 INFO #
- name: GET Serial to Info All
  uri:
    url: https://apix.cisco.com/sn2info/v2/coverage/summary/serial_numbers/{{ hostvars[item]['serial'] }}
    method: GET
    headers:
      Authorization: "{{token_type}} {{access_token}}"
      Cache-Control: no-cache
      Accept-Encoding: gzip, deflate, br
      Connection: keep-alive
      Accept: application/json
    return_content: yes
    validate_certs: no
    force_basic_auth: yes
    follow_redirects: yes
  register: Serial2Info
  loop: "{{ groups['cisco'] }}"
  delegate_to: localhost
  tags:
    - serial2info_all

- name: Create raw YAML
  copy:
    content: |
      {{ Serial2Info | to_nice_yaml }}
    dest: "{{ dest_folder }}/{{ inventory_file }}"
  tags:
    - serial2info_all

- name: push to git
  run_once: true
  shell: |
    git config --global user.email "networks@talend.com"
    git config --global user.name "sa-netgit"
    git add {{ inventory_file }}
    git commit -m "inventory: $(date +"%Y-%m-%d %H:%M:%S")"
    git push origin master
    exit 0
  args:
    chdir: "{{ dest_folder }}"
  tags:
    - serial2info_all
