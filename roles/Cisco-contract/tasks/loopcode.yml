---
- name: Set counter
  set_fact:
    counter: "{{ 1 if counter is undefined else counter|int + 1 }}"
  tags:
    - serial2info_netbox

- name: GET Serial to Info3
  uri:
    url: https://apix.cisco.com/sn2info/v2/coverage/summary/serial_numbers/{{ item.value.serial }}
    method: GET
    headers:
      Authorization: "{{token_type}} {{access_token}}"
      Cache-Control: no-cache
      Accept-Encoding: gzip, deflate, br
      Connection: keep-alive
      Accept: application/json
    return_content: yes
    validate_certs: no
    force_basic_auth: yes
    follow_redirects: yes
  register: Serial2Info
  delegate_to: localhost
  ignore_errors: yes
  tags:
    - serial2info_netbox

- debug:
    msg: "{{ counter|int }} {{ item.value.name }} {{ item.value.serial }} {{ Serial2Info.json.serial_numbers[0].is_covered }} Support end date: {{ Serial2Info.json.serial_numbers[0].covered_product_line_end_date }} Warranty End Date: {{ Serial2Info.json.serial_numbers[0].warranty_end_date }}"
  delegate_to: localhost
  when: Serial2Info is defined and Serial2Info.json.serial_numbers is defined
  tags:
    - serial2info_netbox

- name: update Netbox custom field
  netbox.netbox.netbox_device:
    netbox_url: "{{ NETBOX_API }}"
    netbox_token: "{{ NETBOX_TOKEN }}"
    data:
      name: "{{ item.value.name }}"
      custom_fields:
        is_covered_by_contract: "{{ Serial2Info.json.serial_numbers[0].is_covered }}"
        support_expiry_date: "{{ Serial2Info.json.serial_numbers[0].covered_product_line_end_date }}"
        warranty_end_date: "{{ Serial2Info.json.serial_numbers[0].warranty_end_date }}"
    state: present
  when: Serial2Info is defined and Serial2Info.json.serial_numbers is defined
  tags:
    - serial2info_netbox
