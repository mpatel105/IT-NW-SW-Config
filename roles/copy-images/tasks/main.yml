---

- name: Check current version
  ios_facts:
  tags:
    - copy-test
    - copy

- debug:
    msg: "Current version is {{ ansible_net_version }}"
  tags:
    - copy-test
    - copy

- debug:
    msg:
    - "Image {{ ansible_net_version }} is not compliant and will be upgraded"
  when: ansible_net_version != upgrade_ios_version
  tags:
    - copy-test
    - copy

- name: cleanup switch flash
  cli_command:
    command: "request platform software package clean"
    check_all: True
    prompt:
      - 'Do you want to proceed'
    answer:
      - 'y'
  tags:
    - copy-clean

- name: Copy IOS image using SCP
  cli_command:
    command: "copy scp://{{scp_server_username}}@{{scp_region_server}}//root/networkscript/ios-image/{{ new_ios_image }} flash:"
    check_all: True
    prompt:
      - 'Destination filename'
      - 'Password:'
    answer:
      - '{{new_ios_image}}'
      - '{{scp_server_password}}'
  tags:
    - copy-copy
