- name: Create cable within NetBox
  netbox.netbox.netbox_cable:
    netbox_url: "{{ NETBOX_API }}"
    netbox_token: "{{ NETBOX_TOKEN }}"
    data:
      termination_a_type: dcim.interface
      termination_a:
        device: "{{ ansible_net_hostname }}"
        name: "{{ item.key }}"
      termination_b_type: dcim.interface
      termination_b:
        device: "{% if napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key] is defined and 'Meraki' in napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key][0]['remote_system_description'] %}{{ napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key][0]['remote_system_name']|lower }}{% else %}{{ item.value[0].host.split('.')[0]|lower }}{% endif %}"
        name: "{% if napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key] is defined and 'Meraki' in napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key][0]['remote_system_description'] %}main{% else %}{{ item.value[0].port }}{% endif %}"
      status: connected
    state: present
  loop: "{{ ansible_net_neighbors | default({}) | dict2items }}"
  ignore_errors: yes
  when:
    - ansible_network_os is defined and (ansible_network_os == "ios" or ansible_network_os == "nxos") and
      ( item.value[0].host is defined and item.value[0].host is string and sites[0] == item.value[0].host.split('.')[0][:3]|lower and item.value[0].host.split('.')[0] in groups['all'] or
      ( napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key] is defined and 'Meraki' in napalmfacts['ansible_facts']['napalm_lldp_neighbors_detail'][item.key][0]['remote_system_description'] ))
  tags:
    - cabling
