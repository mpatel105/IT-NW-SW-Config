---
# tasks file for netbox-update
- name: Getting IOS facts
  ios_facts:
    gather_subset: hardware
  when: ansible_network_os == 'ios'
  tags:
    - OSupdate

- name: IOS - update custom field OS version
  netbox.netbox.netbox_device:
    netbox_url: "{{ netboxurl }}"
    netbox_token: "{{ netboxapitoken }}"
    data:
      name: "{{ inventory_hostname }}"
      # custom_fields:
      #   OS_Version: {{ ansible_net_version }}
    state: present
  when: ansible_network_os == 'ios'
  tags:
    - OSupdate
