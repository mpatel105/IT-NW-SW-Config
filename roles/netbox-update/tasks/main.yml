---
# tasks file for netbox-update
- name: Getting IOS facts
  ios_facts:
    gather_subset:
      - hardware
      - interfaces
  when: ansible_network_os is defined and ansible_network_os == 'ios'
  tags:
    - OSupdate
    - cabling

- name: NXOS get fact
  cisco.nxos.nxos_facts:
    gather_subset:
      - hardware
      - interfaces
  when: ansible_network_os is defined and  ansible_network_os == 'nxos'
  tags:
    - OSupdate
    - cabling

- name: PANOS get fact
  paloaltonetworks.panos.panos_op:
    provider: '{{ device }}'
    cmd: 'show system info'
  register: res
  when: ansible_network_os == 'panos'
  tags:
    - pan
    - OSupdate

- name: napalm get_facts
  napalm.napalm.get_facts:
    filter: facts,lldp_neighbors_detail
  register: napalmfacts
  when: ansible_network_os is defined and (ansible_network_os == 'ios' or ansible_network_os == 'nxos')
  tags:
    - cabling


- name: IOS/NXOS - update custom field OS version
  netbox.netbox.netbox_device:
    netbox_url: "{{ NETBOX_API }}"
    netbox_token: "{{ NETBOX_TOKEN }}"
    data:
      name: "{{ ansible_net_hostname }}{% if ansible_net_stacked_models is defined and (ansible_net_stacked_models | length) > 1 and ansible_loop.index > 1 %}-{{ansible_loop.index}}{% else %}{% endif %}"
#      serial: "{{ ansible_net_stacked_serialnums[ansible_loop.index0] | default(ansible_net_serialnum) }}"
      custom_fields:
        version: "{{ ansible_net_version }}"
    state: present
#loop: "{{ ansible_net_stacked_models if ansible_net_stacked_models is defined and ansible_net_stacked_models is iterable else ansible_net_model if ansible_net_model is defined else [] }}"
  loop: "{{ ansible_net_stacked_models if ansible_net_stacked_models is defined and ansible_net_stacked_models is iterable else [ansible_net_model] if ansible_net_model is defined else [] }}"
  loop_control:
    extended: yes
  when: ansible_network_os is defined and ansible_net_model is defined and (ansible_network_os == 'ios' or ansible_network_os == 'nxos')
  tags:
    - OSupdate

