- name: PANOS - update custom field OS version
  netbox.netbox.netbox_device:
    netbox_url: "{{ NETBOX_API }}"
    netbox_token: "{{ NETBOX_TOKEN }}"
    data:
      name: "{{ (res.stdout | from_json).response.result.system.hostname }}"
      serial: "{{ (res.stdout | from_json).response.result.system.serial }}"
      custom_fields:
        version: "{{ (res.stdout | from_json).response.result.system['sw-version'] }}"
    state: present
  when: ansible_network_os is defined and ansible_network_os == 'panos' and inventory_hostname not in groups['is_virtual']
  tags:
    - OSupdate

