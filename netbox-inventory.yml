---
plugin: netbox.netbox.nb_inventory
validate_certs: True
config_context: false
compose:
  ansible_network_os: "{% if platform.slug is defined %}{{platform.slug}}{%else%}{%endif%}"
group_by:
  - region
  - device_roles
  - platforms
  - sites
  - site_group
group_names_raw: True
device_query_filters:
  - status: 'active'
  - has_primary_ip: 'true'
