plugin: netbox.netbox.nb_inventory
validate_certs: True
config_context: True
query_filters:
  - status: active
  - manufacturer: cisco
flatten_config_context: True
compose:
  ansible_network_os: platform.slug
group_by:
  - region
  - device_roles
  - device_types
  - manufacturers
  - platforms
  - sites
  - site_group
  - is_virtual
  - tenants
group_names_raw: True
# interfaces: True
device_query_filters:
  - status: 'active'
  - has_primary_ip: 'true'
  - manufacturer_id: 2
