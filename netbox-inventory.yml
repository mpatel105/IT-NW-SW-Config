---
plugin: netbox.netbox.nb_inventory
validate_certs: True
config_context: false
compose:
  ansible_network_os: "{% if 'cisco-ios' in platform.slug %}ios{% elif 'cisco-nxos' in platform.slug %}nxos{% elif 'pan-os' in platform.slug %}panos{% else %}unknown{% endif %}"
group_by:
  - region
  - device_roles
  - device_types
  - platforms
  - sites
  - site_group
  - is_virtual
  - tenants
group_names_raw: True
device_query_filters:
  - status: 'active'
  - has_primary_ip: 'true'
