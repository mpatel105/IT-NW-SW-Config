---
plugin: netbox.netbox.nb_inventory
validate_certs: True
config_context: false
compose:
#  ansible_network_os: platform.slug
  ansible_network_os: "{% if ('ios-xe' in platform.slug) %}ios{% else %}platform.slug{% endif %}"
group_by:
  - region
  - device_roles
device_query_filters:
  - status: 'active'
  - has_primary_ip: 'true'
