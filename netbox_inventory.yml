---
plugin: netbox.netbox.nb_inventory
api_endpoint: https://pa7-netbox-001.talend.com
token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
validate_certs: True
compose:
  ansible_network_os: platform.slug
group_by:
  - location
  - region
  - device_roles
  - manufacturers
  - platforms
device_query_filters:
  - has_primary_ip: 'true'
  - status: 'active'
